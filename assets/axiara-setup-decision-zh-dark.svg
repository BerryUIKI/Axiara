<svg viewBox="0 0 1280 700" width="100%" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Axiara 初始化决策树</title>
<desc>初始化选择：语言 → 存储与同步 → 数据来源 → 开发环境</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- Header -->
<rect x="40" y="20" width="1200" height="56" rx="12" fill="#04342C" stroke="#5DCAA5" stroke-width="1"/>
<text x="640" y="55" font-size="28" font-weight="600" fill="#E1F5EE" text-anchor="middle">Axiara 初始化 — 四个简单选择</text>

<!-- ============ Step 1 — Language ============ -->
<text x="640" y="100" font-size="22" font-weight="600" fill="#E1F5EE" text-anchor="middle">1 · 界面语言</text>
<rect x="40" y="112" width="1200" height="64" rx="10" fill="#0E2402" stroke="#618D3A" stroke-width="1"/>
<text x="640" y="138" font-size="16" fill="#C0DD97" text-anchor="middle">简体中文 · 繁體中文 · English · 日本語 · 한국어</text>
<text x="640" y="162" font-size="16" fill="#97C459" text-anchor="middle">Français · Deutsch · Español · Português · Русский</text>
<line x1="640" y1="180" x2="640" y2="202" stroke="#9E9D98" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- ============ Step 2 — Storage & sync ============ -->
<text x="640" y="224" font-size="22" font-weight="600" fill="#E1F5EE" text-anchor="middle">2 · 存储与同步 — 需要团队同步吗？</text>

<line x1="640" y1="236" x2="230" y2="262" stroke="#9E9D98" stroke-width="1.5"/>
<line x1="640" y1="236" x2="640" y2="262" stroke="#9E9D98" stroke-width="1.5"/>
<line x1="640" y1="236" x2="1050" y2="262" stroke="#9E9D98" stroke-width="1.5"/>

<rect x="40" y="266" width="380" height="96" rx="10" fill="#173404" stroke="#97C459" stroke-width="1"/>
<text x="230" y="294" font-size="20" font-weight="600" fill="#C0DD97" text-anchor="middle">不需要 — 个人使用</text>
<text x="230" y="324" font-size="16" fill="#97C459" text-anchor="middle">SQLite · 零配置</text>
<text x="230" y="348" font-size="16" fill="#97C459" text-anchor="middle">单文件数据库</text>

<rect x="450" y="266" width="380" height="96" rx="10" fill="#26215C" stroke="#AFA9EC" stroke-width="1"/>
<text x="640" y="294" font-size="20" font-weight="600" fill="#CECBF6" text-anchor="middle">需要 — 文本 + Git</text>
<text x="640" y="324" font-size="16" fill="#AFA9EC" text-anchor="middle">CSV 文件经 git 同步</text>
<text x="640" y="348" font-size="16" fill="#AFA9EC" text-anchor="middle">免服务器 · 本地缓存</text>

<rect x="860" y="266" width="380" height="96" rx="10" fill="#412402" stroke="#EF9F27" stroke-width="1"/>
<text x="1050" y="294" font-size="20" font-weight="600" fill="#FAC775" text-anchor="middle">需要 — SQL 服务器</text>
<text x="1050" y="324" font-size="16" fill="#EF9F27" text-anchor="middle">MySQL · MariaDB ·</text>
<text x="1050" y="348" font-size="16" fill="#EF9F27" text-anchor="middle">PostgreSQL（DSN）</text>

<line x1="230" y1="366" x2="230" y2="388" stroke="#9E9D98" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="640" y1="366" x2="640" y2="388" stroke="#9E9D98" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="1050" y1="366" x2="1050" y2="388" stroke="#9E9D98" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- ============ Step 3 — Data source ============ -->
<text x="640" y="410" font-size="22" font-weight="600" fill="#E1F5EE" text-anchor="middle">3 · 数据来源</text>

<line x1="230" y1="420" x2="230" y2="442" stroke="#9E9D98" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="640" y1="420" x2="640" y2="442" stroke="#9E9D98" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="1050" y1="420" x2="1050" y2="442" stroke="#9E9D98" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="446" width="380" height="76" rx="10" fill="#0E2402" stroke="#618D3A" stroke-width="1"/>
<text x="230" y="474" font-size="20" font-weight="600" fill="#C0DD97" text-anchor="middle">本地文件</text>
<text x="230" y="502" font-size="16" fill="#97C459" text-anchor="middle">导入价目表（Excel / CSV）</text>

<rect x="450" y="446" width="380" height="76" rx="10" fill="#1C1848" stroke="#7A71C9" stroke-width="1"/>
<text x="640" y="474" font-size="20" font-weight="600" fill="#CECBF6" text-anchor="middle">团队仓库</text>
<text x="640" y="502" font-size="16" fill="#AFA9EC" text-anchor="middle">仓库 URL → 克隆到 store/</text>

<rect x="860" y="446" width="380" height="76" rx="10" fill="#2F1B02" stroke="#B97B2A" stroke-width="1"/>
<text x="1050" y="474" font-size="20" font-weight="600" fill="#FAC775" text-anchor="middle">暂无数据</text>
<text x="1050" y="502" font-size="16" fill="#EF9F27" text-anchor="middle">空数据起步，之后按需抓取</text>

<line x1="230" y1="526" x2="230" y2="548" stroke="#9E9D98" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="640" y1="526" x2="640" y2="548" stroke="#9E9D98" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="1050" y1="526" x2="1050" y2="548" stroke="#9E9D98" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- ============ Step 4 — Dev environment ============ -->
<text x="640" y="570" font-size="22" font-weight="600" fill="#E1F5EE" text-anchor="middle">4 · 开发环境（可选）</text>

<line x1="425" y1="582" x2="425" y2="604" stroke="#9E9D98" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="855" y1="582" x2="855" y2="604" stroke="#9E9D98" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="160" y="608" width="530" height="64" rx="10" fill="#04342C" stroke="#5DCAA5" stroke-width="1"/>
<text x="425" y="634" font-size="18" font-weight="600" fill="#E1F5EE" text-anchor="middle">只用 AI Agent（推荐，零配置）</text>
<text x="425" y="658" font-size="14" fill="#9FE1CB" text-anchor="middle">你的 AI 助手全权处理</text>

<rect x="590" y="608" width="530" height="64" rx="10" fill="#412402" stroke="#EF9F27" stroke-width="1"/>
<text x="855" y="634" font-size="18" font-weight="600" fill="#FAC775" text-anchor="middle">配置开发环境</text>
<text x="855" y="658" font-size="14" fill="#EF9F27" text-anchor="middle">uv sync → REST API · CLI · 测试</text>
</svg>
