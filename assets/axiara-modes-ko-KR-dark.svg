<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 660" width="100%" role="img">
<title>Axiara four modes</title>
<desc>Four modes: Archive (Mode 1), Query (Mode 2), Quote (Mode 3), Review (Mode 4) — each with input, process and output</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
</marker>
</defs>


<rect x="40" y="20" width="1200" height="56" rx="12" fill="#04342C" stroke="#5DCAA5" stroke-width="1" />
<text x="640" y="48" font-size="28" font-weight="600" fill="#E1F5EE" text-anchor="middle">네 가지 모드 — Axiara가 하는 일</text>
<text x="640" y="68" font-size="14" fill="#9FE1CB" text-anchor="middle">에이전트는 작업별로 모드를 선택합니다. 각 모드는 기능과 권한의 경계입니다</text>


<rect x="40" y="92" width="280" height="56" rx="10" fill="#173404" stroke="#97C459" stroke-width="1" />
<text x="180" y="118" font-size="22" font-weight="600" fill="#C0DD97" text-anchor="middle">모드 1 — 아카이브</text>
<text x="180" y="140" font-size="14" fill="#97C459" text-anchor="middle">공식 가격 입력 · 학습 · 크롤링</text>

<text x="180" y="166" font-size="14" font-weight="600" fill="#9E9D98" text-anchor="middle">입력</text>
<rect x="40" y="176" width="280" height="88" rx="10" fill="#0E2402" stroke="#618D3A" stroke-width="1" />
<text x="180" y="200" font-size="16" fill="#C0DD97" text-anchor="middle">가격표 · 문서</text>
<text x="180" y="226" font-size="16" fill="#C0DD97" text-anchor="middle">과거 견적</text>
<text x="180" y="252" font-size="16" fill="#97C459" text-anchor="middle">크롤링 URL</text>

<line x1="180" y1="270" x2="180" y2="292" stroke="#9E9D98" stroke-width="1.5" marker-end="url(#arrow)" />
<text x="180" y="310" font-size="14" font-weight="600" fill="#9E9D98" text-anchor="middle">처리</text>
<rect x="40" y="320" width="280" height="112" rx="10" fill="#173404" stroke="#97C459" stroke-width="1" />
<text x="180" y="344" font-size="16" fill="#C0DD97" text-anchor="middle">수동 입력 (버전 관리,</text>
<text x="180" y="370" font-size="16" fill="#C0DD97" text-anchor="middle">롤백 가능)</text>
<text x="180" y="396" font-size="16" fill="#97C459" text-anchor="middle">문서에서 AI 학습</text>
<text x="180" y="422" font-size="16" fill="#97C459" text-anchor="middle">요청 시 시장 크롤링</text>

<line x1="180" y1="438" x2="180" y2="460" stroke="#9E9D98" stroke-width="1.5" marker-end="url(#arrow)" />
<text x="180" y="478" font-size="14" font-weight="600" fill="#9E9D98" text-anchor="middle">출력</text>
<rect x="40" y="488" width="280" height="88" rx="10" fill="#0E2402" stroke="#618D3A" stroke-width="1" />
<text x="180" y="512" font-size="16" fill="#C0DD97" text-anchor="middle">main_db · learn_db</text>
<text x="180" y="538" font-size="16" fill="#97C459" text-anchor="middle">market_db (확인 후)</text>


<rect x="340" y="92" width="280" height="56" rx="10" fill="#26215C" stroke="#AFA9EC" stroke-width="1" />
<text x="480" y="118" font-size="22" font-weight="600" fill="#CECBF6" text-anchor="middle">모드 2 — 조회</text>
<text x="480" y="140" font-size="14" fill="#AFA9EC" text-anchor="middle">단일 품목 상세 조회</text>

<text x="480" y="166" font-size="14" font-weight="600" fill="#9E9D98" text-anchor="middle">입력</text>
<rect x="340" y="176" width="280" height="88" rx="10" fill="#1C1848" stroke="#7A71C9" stroke-width="1" />
<text x="480" y="200" font-size="16" fill="#CECBF6" text-anchor="middle">재료 / 제품명</text>
<text x="480" y="226" font-size="16" fill="#CECBF6" text-anchor="middle">(+ 수량 / 단위)</text>
<text x="480" y="252" font-size="16" fill="#AFA9EC" text-anchor="middle">규격 / 메모 일치</text>

<line x1="480" y1="270" x2="480" y2="292" stroke="#9E9D98" stroke-width="1.5" marker-end="url(#arrow)" />
<text x="480" y="310" font-size="14" font-weight="600" fill="#9E9D98" text-anchor="middle">처리</text>
<rect x="340" y="320" width="280" height="112" rx="10" fill="#26215C" stroke="#AFA9EC" stroke-width="1" />
<text x="480" y="344" font-size="16" fill="#CECBF6" text-anchor="middle">먼저 main_db 원가 확인</text>
<text x="480" y="370" font-size="16" fill="#CECBF6" text-anchor="middle">(최우선)</text>
<text x="480" y="396" font-size="16" fill="#AFA9EC" text-anchor="middle">market_db 중첩</text>
<text x="480" y="422" font-size="16" fill="#AFA9EC" text-anchor="middle">변동 가격 범위</text>

<line x1="480" y1="438" x2="480" y2="460" stroke="#9E9D98" stroke-width="1.5" marker-end="url(#arrow)" />
<text x="480" y="478" font-size="14" font-weight="600" fill="#9E9D98" text-anchor="middle">출력</text>
<rect x="340" y="488" width="280" height="88" rx="10" fill="#1C1848" stroke="#7A71C9" stroke-width="1" />
<text x="480" y="512" font-size="16" fill="#CECBF6" text-anchor="middle">표준 원가 + 시장</text>
<text x="480" y="538" font-size="16" fill="#AFA9EC" text-anchor="middle">참고 + 공정 메모</text>


<rect x="640" y="92" width="280" height="56" rx="10" fill="#412402" stroke="#EF9F27" stroke-width="1" />
<text x="780" y="118" font-size="22" font-weight="600" fill="#FAC775" text-anchor="middle">모드 3 — 견적</text>
<text x="780" y="140" font-size="14" fill="#EF9F27" text-anchor="middle">BOM 일괄 보충 · 스마트 견적</text>

<text x="780" y="166" font-size="14" font-weight="600" fill="#9E9D98" text-anchor="middle">입력</text>
<rect x="640" y="176" width="280" height="88" rx="10" fill="#2F1B02" stroke="#B97B2A" stroke-width="1" />
<text x="780" y="200" font-size="16" fill="#FAC775" text-anchor="middle">BOM / 자재 목록</text>
<text x="780" y="226" font-size="16" fill="#FAC775" text-anchor="middle">제약 (기본 /</text>
<text x="780" y="252" font-size="16" fill="#EF9F27" text-anchor="middle">프로젝트)</text>

<line x1="780" y1="270" x2="780" y2="292" stroke="#9E9D98" stroke-width="1.5" marker-end="url(#arrow)" />
<text x="780" y="310" font-size="14" font-weight="600" fill="#9E9D98" text-anchor="middle">처리</text>
<rect x="640" y="320" width="280" height="112" rx="10" fill="#412402" stroke="#EF9F27" stroke-width="1" />
<text x="780" y="344" font-size="16" fill="#FAC775" text-anchor="middle">원가 계산</text>
<text x="780" y="370" font-size="16" fill="#FAC775" text-anchor="middle">3단계 가격</text>
<text x="780" y="396" font-size="16" fill="#EF9F27" text-anchor="middle">(저 / 중 / 고)</text>
<text x="780" y="422" font-size="16" fill="#EF9F27" text-anchor="middle">템플릿 적응</text>

<line x1="780" y1="438" x2="780" y2="460" stroke="#9E9D98" stroke-width="1.5" marker-end="url(#arrow)" />
<text x="780" y="478" font-size="14" font-weight="600" fill="#9E9D98" text-anchor="middle">출력</text>
<rect x="640" y="488" width="280" height="88" rx="10" fill="#2F1B02" stroke="#B97B2A" stroke-width="1" />
<text x="780" y="512" font-size="16" fill="#FAC775" text-anchor="middle">견적서를 output/로</text>
<text x="780" y="538" font-size="16" fill="#EF9F27" text-anchor="middle">(기본 또는 사용자 템플릿)</text>


<rect x="940" y="92" width="280" height="56" rx="10" fill="#04342C" stroke="#5DCAA5" stroke-width="1" />
<text x="1080" y="118" font-size="22" font-weight="600" fill="#E1F5EE" text-anchor="middle">모드 4 — 검토</text>
<text x="1080" y="140" font-size="14" fill="#9FE1CB" text-anchor="middle">사용자 표 교차 검증</text>

<text x="1080" y="166" font-size="14" font-weight="600" fill="#9E9D98" text-anchor="middle">입력</text>
<rect x="940" y="176" width="280" height="88" rx="10" fill="#04241C" stroke="#3E9C7D" stroke-width="1" />
<text x="1080" y="200" font-size="16" fill="#E1F5EE" text-anchor="middle">사용자 원가 /</text>
<text x="1080" y="226" font-size="16" fill="#E1F5EE" text-anchor="middle">견적 표</text>
<text x="1080" y="252" font-size="16" fill="#9FE1CB" text-anchor="middle">(메모 포함)</text>

<line x1="1080" y1="270" x2="1080" y2="292" stroke="#9E9D98" stroke-width="1.5" marker-end="url(#arrow)" />
<text x="1080" y="310" font-size="14" font-weight="600" fill="#9E9D98" text-anchor="middle">처리</text>
<rect x="940" y="320" width="280" height="112" rx="10" fill="#04342C" stroke="#5DCAA5" stroke-width="1" />
<text x="1080" y="344" font-size="16" fill="#E1F5EE" text-anchor="middle">main_db + market_db와</text>
<text x="1080" y="370" font-size="16" fill="#E1F5EE" text-anchor="middle">교차 검증</text>
<text x="1080" y="396" font-size="16" fill="#9FE1CB" text-anchor="middle">이상 가격 감지</text>
<text x="1080" y="422" font-size="16" fill="#9FE1CB" text-anchor="middle">(너무 높음 / 낮음)</text>

<line x1="1080" y1="438" x2="1080" y2="460" stroke="#9E9D98" stroke-width="1.5" marker-end="url(#arrow)" />
<text x="1080" y="478" font-size="14" font-weight="600" fill="#9E9D98" text-anchor="middle">출력</text>
<rect x="940" y="488" width="280" height="88" rx="10" fill="#04241C" stroke="#3E9C7D" stroke-width="1" />
<text x="1080" y="512" font-size="16" fill="#E1F5EE" text-anchor="middle">이상 플래그 +</text>
<text x="1080" y="538" font-size="16" fill="#9FE1CB" text-anchor="middle">조정 제안</text>

<text x="640" y="616" font-size="14" fill="#9E9D98" text-anchor="middle">공식 기준선은 절대 덮어쓰지 않음 — 학습·시장 데이터는 확인 후에만 등록</text>
</svg>