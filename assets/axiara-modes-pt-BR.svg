<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 660" width="100%" role="img">
<title>Axiara four modes</title>
<desc>Four modes: Archive (Mode 1), Query (Mode 2), Quote (Mode 3), Review (Mode 4) — each with input, process and output</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
</marker>
</defs>


<rect x="40" y="20" width="1200" height="56" rx="12" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1" />
<text x="640" y="48" font-size="28" font-weight="600" fill="#04342C" text-anchor="middle">Quatro modos — o que a Axiara faz</text>
<text x="640" y="68" font-size="14" fill="#0F6E56" text-anchor="middle">Os agentes escolhem um modo por tarefa; cada modo é um limite de capacidade e permissão</text>


<rect x="40" y="92" width="280" height="56" rx="10" fill="#EAF3DE" stroke="#639922" stroke-width="1" />
<text x="180" y="118" font-size="22" font-weight="600" fill="#27500A" text-anchor="middle">Modo 1 — Arquivo</text>
<text x="180" y="140" font-size="14" fill="#3B6D11" text-anchor="middle">preços oficiais · aprender · rastrear</text>

<text x="180" y="166" font-size="14" font-weight="600" fill="#888780" text-anchor="middle">ENTRADA</text>
<rect x="40" y="176" width="280" height="88" rx="10" fill="#F6F9EE" stroke="#A8C97E" stroke-width="1" />
<text x="180" y="200" font-size="16" fill="#27500A" text-anchor="middle">Listas de preços · documentos</text>
<text x="180" y="226" font-size="16" fill="#27500A" text-anchor="middle">cotações históricas</text>
<text x="180" y="252" font-size="16" fill="#3B6D11" text-anchor="middle">URLs para rastrear</text>

<line x1="180" y1="270" x2="180" y2="292" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)" />
<text x="180" y="310" font-size="14" font-weight="600" fill="#888780" text-anchor="middle">PROCESSAMENTO</text>
<rect x="40" y="320" width="280" height="112" rx="10" fill="#EAF3DE" stroke="#639922" stroke-width="1" />
<text x="180" y="344" font-size="16" fill="#27500A" text-anchor="middle">Entrada manual (com versão,</text>
<text x="180" y="370" font-size="16" fill="#27500A" text-anchor="middle">reversível)</text>
<text x="180" y="396" font-size="16" fill="#3B6D11" text-anchor="middle">Aprendizado de IA de documentos</text>
<text x="180" y="422" font-size="16" fill="#3B6D11" text-anchor="middle">Rastreio de mercado, sob demanda</text>

<line x1="180" y1="438" x2="180" y2="460" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)" />
<text x="180" y="478" font-size="14" font-weight="600" fill="#888780" text-anchor="middle">SAÍDA</text>
<rect x="40" y="488" width="280" height="88" rx="10" fill="#F6F9EE" stroke="#A8C97E" stroke-width="1" />
<text x="180" y="512" font-size="16" fill="#27500A" text-anchor="middle">main_db · learn_db</text>
<text x="180" y="538" font-size="16" fill="#3B6D11" text-anchor="middle">market_db (confirmar antes)</text>


<rect x="340" y="92" width="280" height="56" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1" />
<text x="480" y="118" font-size="22" font-weight="600" fill="#3C3489" text-anchor="middle">Modo 2 — Consulta</text>
<text x="480" y="140" font-size="14" fill="#534AB7" text-anchor="middle">consulta detalhada de um item</text>

<text x="480" y="166" font-size="14" font-weight="600" fill="#888780" text-anchor="middle">ENTRADA</text>
<rect x="340" y="176" width="280" height="88" rx="10" fill="#F7F6FE" stroke="#B3ADEB" stroke-width="1" />
<text x="480" y="200" font-size="16" fill="#3C3489" text-anchor="middle">Um material / produto</text>
<text x="480" y="226" font-size="16" fill="#3C3489" text-anchor="middle">nome (+ quantidade / unidade)</text>
<text x="480" y="252" font-size="16" fill="#534AB7" text-anchor="middle">especificações / notas</text>

<line x1="480" y1="270" x2="480" y2="292" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)" />
<text x="480" y="310" font-size="14" font-weight="600" fill="#888780" text-anchor="middle">PROCESSAMENTO</text>
<rect x="340" y="320" width="280" height="112" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1" />
<text x="480" y="344" font-size="16" fill="#3C3489" text-anchor="middle">Ler custo de main_db primeiro</text>
<text x="480" y="370" font-size="16" fill="#3C3489" text-anchor="middle">(maior peso)</text>
<text x="480" y="396" font-size="16" fill="#534AB7" text-anchor="middle">Sobrepor market_db</text>
<text x="480" y="422" font-size="16" fill="#534AB7" text-anchor="middle">faixa de preço flutuante</text>

<line x1="480" y1="438" x2="480" y2="460" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)" />
<text x="480" y="478" font-size="14" font-weight="600" fill="#888780" text-anchor="middle">SAÍDA</text>
<rect x="340" y="488" width="280" height="88" rx="10" fill="#F7F6FE" stroke="#B3ADEB" stroke-width="1" />
<text x="480" y="512" font-size="16" fill="#3C3489" text-anchor="middle">Custo padrão + mercado</text>
<text x="480" y="538" font-size="16" fill="#534AB7" text-anchor="middle">referência + notas de processo</text>


<rect x="640" y="92" width="280" height="56" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="1" />
<text x="780" y="118" font-size="22" font-weight="600" fill="#633806" text-anchor="middle">Modo 3 — Cotação</text>
<text x="780" y="140" font-size="14" fill="#854F0B" text-anchor="middle">preenchimento BOM em lote · cotação inteligente</text>

<text x="780" y="166" font-size="14" font-weight="600" fill="#888780" text-anchor="middle">ENTRADA</text>
<rect x="640" y="176" width="280" height="88" rx="10" fill="#FDF6EA" stroke="#D6A96B" stroke-width="1" />
<text x="780" y="200" font-size="16" fill="#633806" text-anchor="middle">BOM / lista de materiais</text>
<text x="780" y="226" font-size="16" fill="#633806" text-anchor="middle">restrições (padrão /</text>
<text x="780" y="252" font-size="16" fill="#854F0B" text-anchor="middle">projeto)</text>

<line x1="780" y1="270" x2="780" y2="292" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)" />
<text x="780" y="310" font-size="14" font-weight="600" fill="#888780" text-anchor="middle">PROCESSAMENTO</text>
<rect x="640" y="320" width="280" height="112" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="1" />
<text x="780" y="344" font-size="16" fill="#633806" text-anchor="middle">Cálculo de custo</text>
<text x="780" y="370" font-size="16" fill="#633806" text-anchor="middle">Preços em três níveis</text>
<text x="780" y="396" font-size="16" fill="#854F0B" text-anchor="middle">(baixo / médio / alto)</text>
<text x="780" y="422" font-size="16" fill="#854F0B" text-anchor="middle">Adaptação de modelo</text>

<line x1="780" y1="438" x2="780" y2="460" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)" />
<text x="780" y="478" font-size="14" font-weight="600" fill="#888780" text-anchor="middle">SAÍDA</text>
<rect x="640" y="488" width="280" height="88" rx="10" fill="#FDF6EA" stroke="#D6A96B" stroke-width="1" />
<text x="780" y="512" font-size="16" fill="#633806" text-anchor="middle">Cotação para output/</text>
<text x="780" y="538" font-size="16" fill="#854F0B" text-anchor="middle">(modelo padrão ou do usuário)</text>


<rect x="940" y="92" width="280" height="56" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1" />
<text x="1080" y="118" font-size="22" font-weight="600" fill="#04342C" text-anchor="middle">Modo 4 — Revisão</text>
<text x="1080" y="140" font-size="14" fill="#0F6E56" text-anchor="middle">validação cruzada de tabelas do usuário</text>

<text x="1080" y="166" font-size="14" font-weight="600" fill="#888780" text-anchor="middle">ENTRADA</text>
<rect x="940" y="176" width="280" height="88" rx="10" fill="#EFFAF6" stroke="#6EC6A6" stroke-width="1" />
<text x="1080" y="200" font-size="16" fill="#04342C" text-anchor="middle">Custo próprio /</text>
<text x="1080" y="226" font-size="16" fill="#04342C" text-anchor="middle">tabela de cotação</text>
<text x="1080" y="252" font-size="16" fill="#0F6E56" text-anchor="middle">(com notas)</text>

<line x1="1080" y1="270" x2="1080" y2="292" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)" />
<text x="1080" y="310" font-size="14" font-weight="600" fill="#888780" text-anchor="middle">PROCESSAMENTO</text>
<rect x="940" y="320" width="280" height="112" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1" />
<text x="1080" y="344" font-size="16" fill="#04342C" text-anchor="middle">Validar cruzado contra</text>
<text x="1080" y="370" font-size="16" fill="#04342C" text-anchor="middle">main_db + market_db</text>
<text x="1080" y="396" font-size="16" fill="#0F6E56" text-anchor="middle">Sinalizar preços anormais</text>
<text x="1080" y="422" font-size="16" fill="#0F6E56" text-anchor="middle">(alto demais / baixo demais)</text>

<line x1="1080" y1="438" x2="1080" y2="460" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)" />
<text x="1080" y="478" font-size="14" font-weight="600" fill="#888780" text-anchor="middle">SAÍDA</text>
<rect x="940" y="488" width="280" height="88" rx="10" fill="#EFFAF6" stroke="#6EC6A6" stroke-width="1" />
<text x="1080" y="512" font-size="16" fill="#04342C" text-anchor="middle">Sinalizadores de anomalia +</text>
<text x="1080" y="538" font-size="16" fill="#0F6E56" text-anchor="middle">sugestões de ajuste</text>

<text x="640" y="616" font-size="14" fill="#888780" text-anchor="middle">Nunca grava a linha de base oficial — dados aprendidos e de mercado entram somente após confirmação</text>
</svg>