<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 660" width="100%" role="img">
<title>Axiara four modes</title>
<desc>Four modes: Archive (Mode 1), Query (Mode 2), Quote (Mode 3), Review (Mode 4) — each with input, process and output</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
</marker>
</defs>


<rect x="40" y="20" width="1200" height="56" rx="12" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1" />
<text x="640" y="48" font-size="28" font-weight="600" fill="#04342C" text-anchor="middle">四大模式 — Axiara 能做什麼</text>
<text x="640" y="68" font-size="14" fill="#0F6E56" text-anchor="middle">Agent 按任務自主選擇模式；每個模式都是能力與權限邊界</text>


<rect x="40" y="92" width="280" height="56" rx="10" fill="#EAF3DE" stroke="#639922" stroke-width="1" />
<text x="180" y="118" font-size="22" font-weight="600" fill="#27500A" text-anchor="middle">模式一 — 歸檔</text>
<text x="180" y="140" font-size="14" fill="#3B6D11" text-anchor="middle">官方價目錄入 · 學習 · 抓取</text>

<text x="180" y="166" font-size="14" font-weight="600" fill="#888780" text-anchor="middle">輸入</text>
<rect x="40" y="176" width="280" height="88" rx="10" fill="#F6F9EE" stroke="#A8C97E" stroke-width="1" />
<text x="180" y="200" font-size="16" fill="#27500A" text-anchor="middle">價目表 · 單據</text>
<text x="180" y="226" font-size="16" fill="#27500A" text-anchor="middle">歷史報價</text>
<text x="180" y="252" font-size="16" fill="#3B6D11" text-anchor="middle">網頁地址（抓取）</text>

<line x1="180" y1="270" x2="180" y2="292" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)" />
<text x="180" y="310" font-size="14" font-weight="600" fill="#888780" text-anchor="middle">處理</text>
<rect x="40" y="320" width="280" height="112" rx="10" fill="#EAF3DE" stroke="#639922" stroke-width="1" />
<text x="180" y="344" font-size="16" fill="#27500A" text-anchor="middle">人工錄入（帶版本、</text>
<text x="180" y="370" font-size="16" fill="#27500A" text-anchor="middle">可回滾）</text>
<text x="180" y="396" font-size="16" fill="#3B6D11" text-anchor="middle">從單據 AI 學習</text>
<text x="180" y="422" font-size="16" fill="#3B6D11" text-anchor="middle">按需抓取行情</text>

<line x1="180" y1="438" x2="180" y2="460" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)" />
<text x="180" y="478" font-size="14" font-weight="600" fill="#888780" text-anchor="middle">輸出</text>
<rect x="40" y="488" width="280" height="88" rx="10" fill="#F6F9EE" stroke="#A8C97E" stroke-width="1" />
<text x="180" y="512" font-size="16" fill="#27500A" text-anchor="middle">main_db · learn_db</text>
<text x="180" y="538" font-size="16" fill="#3B6D11" text-anchor="middle">market_db（確認後寫入）</text>


<rect x="340" y="92" width="280" height="56" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1" />
<text x="480" y="118" font-size="22" font-weight="600" fill="#3C3489" text-anchor="middle">模式二 — 查詢</text>
<text x="480" y="140" font-size="14" fill="#534AB7" text-anchor="middle">單品詳情查詢</text>

<text x="480" y="166" font-size="14" font-weight="600" fill="#888780" text-anchor="middle">輸入</text>
<rect x="340" y="176" width="280" height="88" rx="10" fill="#F7F6FE" stroke="#B3ADEB" stroke-width="1" />
<text x="480" y="200" font-size="16" fill="#3C3489" text-anchor="middle">某個材料 / 產品</text>
<text x="480" y="226" font-size="16" fill="#3C3489" text-anchor="middle">名稱（+ 數量 / 單位）</text>
<text x="480" y="252" font-size="16" fill="#534AB7" text-anchor="middle">規格 / 備註匹配</text>

<line x1="480" y1="270" x2="480" y2="292" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)" />
<text x="480" y="310" font-size="14" font-weight="600" fill="#888780" text-anchor="middle">處理</text>
<rect x="340" y="320" width="280" height="112" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1" />
<text x="480" y="344" font-size="16" fill="#3C3489" text-anchor="middle">先讀 main_db 成本</text>
<text x="480" y="370" font-size="16" fill="#3C3489" text-anchor="middle">（最高權重）</text>
<text x="480" y="396" font-size="16" fill="#534AB7" text-anchor="middle">疊加 market_db</text>
<text x="480" y="422" font-size="16" fill="#534AB7" text-anchor="middle">浮動價格區間</text>

<line x1="480" y1="438" x2="480" y2="460" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)" />
<text x="480" y="478" font-size="14" font-weight="600" fill="#888780" text-anchor="middle">輸出</text>
<rect x="340" y="488" width="280" height="88" rx="10" fill="#F7F6FE" stroke="#B3ADEB" stroke-width="1" />
<text x="480" y="512" font-size="16" fill="#3C3489" text-anchor="middle">標準成本 + 市場</text>
<text x="480" y="538" font-size="16" fill="#534AB7" text-anchor="middle">參考價 + 工藝備註</text>


<rect x="640" y="92" width="280" height="56" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="1" />
<text x="780" y="118" font-size="22" font-weight="600" fill="#633806" text-anchor="middle">模式三 — 報價</text>
<text x="780" y="140" font-size="14" fill="#854F0B" text-anchor="middle">BOM 批量回填 · 智能報價</text>

<text x="780" y="166" font-size="14" font-weight="600" fill="#888780" text-anchor="middle">輸入</text>
<rect x="640" y="176" width="280" height="88" rx="10" fill="#FDF6EA" stroke="#D6A96B" stroke-width="1" />
<text x="780" y="200" font-size="16" fill="#633806" text-anchor="middle">BOM / 物料清單</text>
<text x="780" y="226" font-size="16" fill="#633806" text-anchor="middle">約束（默認 /</text>
<text x="780" y="252" font-size="16" fill="#854F0B" text-anchor="middle">項目）</text>

<line x1="780" y1="270" x2="780" y2="292" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)" />
<text x="780" y="310" font-size="14" font-weight="600" fill="#888780" text-anchor="middle">處理</text>
<rect x="640" y="320" width="280" height="112" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="1" />
<text x="780" y="344" font-size="16" fill="#633806" text-anchor="middle">成本核算</text>
<text x="780" y="370" font-size="16" fill="#633806" text-anchor="middle">三檔定價</text>
<text x="780" y="396" font-size="16" fill="#854F0B" text-anchor="middle">（低 / 中 / 高）</text>
<text x="780" y="422" font-size="16" fill="#854F0B" text-anchor="middle">模板自適應</text>

<line x1="780" y1="438" x2="780" y2="460" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)" />
<text x="780" y="478" font-size="14" font-weight="600" fill="#888780" text-anchor="middle">輸出</text>
<rect x="640" y="488" width="280" height="88" rx="10" fill="#FDF6EA" stroke="#D6A96B" stroke-width="1" />
<text x="780" y="512" font-size="16" fill="#633806" text-anchor="middle">報價單到 output/</text>
<text x="780" y="538" font-size="16" fill="#854F0B" text-anchor="middle">（默認或用戶模板）</text>


<rect x="940" y="92" width="280" height="56" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1" />
<text x="1080" y="118" font-size="22" font-weight="600" fill="#04342C" text-anchor="middle">模式四 — 複核</text>
<text x="1080" y="140" font-size="14" fill="#0F6E56" text-anchor="middle">交叉校驗用戶表格</text>

<text x="1080" y="166" font-size="14" font-weight="600" fill="#888780" text-anchor="middle">輸入</text>
<rect x="940" y="176" width="280" height="88" rx="10" fill="#EFFAF6" stroke="#6EC6A6" stroke-width="1" />
<text x="1080" y="200" font-size="16" fill="#04342C" text-anchor="middle">用戶自己的成本 /</text>
<text x="1080" y="226" font-size="16" fill="#04342C" text-anchor="middle">報價表格</text>
<text x="1080" y="252" font-size="16" fill="#0F6E56" text-anchor="middle">（含備註）</text>

<line x1="1080" y1="270" x2="1080" y2="292" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)" />
<text x="1080" y="310" font-size="14" font-weight="600" fill="#888780" text-anchor="middle">處理</text>
<rect x="940" y="320" width="280" height="112" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1" />
<text x="1080" y="344" font-size="16" fill="#04342C" text-anchor="middle">對照 main_db +</text>
<text x="1080" y="370" font-size="16" fill="#04342C" text-anchor="middle">market_db 交叉校驗</text>
<text x="1080" y="396" font-size="16" fill="#0F6E56" text-anchor="middle">標記異常價格</text>
<text x="1080" y="422" font-size="16" fill="#0F6E56" text-anchor="middle">（偏高 / 偏低）</text>

<line x1="1080" y1="438" x2="1080" y2="460" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)" />
<text x="1080" y="478" font-size="14" font-weight="600" fill="#888780" text-anchor="middle">輸出</text>
<rect x="940" y="488" width="280" height="88" rx="10" fill="#EFFAF6" stroke="#6EC6A6" stroke-width="1" />
<text x="1080" y="512" font-size="16" fill="#04342C" text-anchor="middle">異常標記 +</text>
<text x="1080" y="538" font-size="16" fill="#0F6E56" text-anchor="middle">調整建議</text>

<text x="640" y="616" font-size="14" fill="#888780" text-anchor="middle">永遠不寫官方基準庫 — 學習與行情數據只在確認後進入</text>
</svg>