<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="100%" role="img">
<title>Axiara architecture</title>
<desc>Axiara agent workspace on top of three isolated data layers: official baseline, learned reference, market prices</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
</marker>
</defs>
<rect x="40" y="20" width="600" height="66" rx="12" fill="#04342C" stroke="#5DCAA5" stroke-width="1" />
<text x="340" y="46" font-size="15" font-weight="600" fill="#E1F5EE" text-anchor="middle">Axiara AgentWorkspace</text>
<text x="340" y="66" font-size="12" fill="#9FE1CB" text-anchor="middle">LangGraph · Kosten-Engine · Preisabruf · Scheduler · Angebot</text>
<line x1="340" y1="86" x2="340" y2="118" stroke="#9E9D98" stroke-width="1.5" marker-end="url(#arrow)" />
<line x1="340" y1="118" x2="135" y2="150" stroke="#9E9D98" stroke-width="1.5" />
<line x1="340" y1="118" x2="340" y2="150" stroke="#9E9D98" stroke-width="1.5" />
<line x1="340" y1="118" x2="545" y2="150" stroke="#9E9D98" stroke-width="1.5" />
<rect x="40" y="154" width="190" height="82" rx="10" fill="#173404" stroke="#97C459" stroke-width="1" />
<text x="135" y="180" font-size="14" font-weight="600" fill="#C0DD97" text-anchor="middle">main_db</text>
<text x="135" y="200" font-size="12" fill="#97C459" text-anchor="middle">Offizielle Basis</text>
<text x="135" y="218" font-size="12" fill="#97C459" text-anchor="middle">nur manuelle Bearbeitung</text>
<rect x="245" y="154" width="190" height="82" rx="10" fill="#26215C" stroke="#AFA9EC" stroke-width="1" />
<text x="340" y="180" font-size="14" font-weight="600" fill="#CECBF6" text-anchor="middle">learn_db</text>
<text x="340" y="200" font-size="12" fill="#AFA9EC" text-anchor="middle">Gelernte Referenz</text>
<text x="340" y="218" font-size="12" fill="#AFA9EC" text-anchor="middle">AI-Training</text>
<rect x="450" y="154" width="190" height="82" rx="10" fill="#412402" stroke="#EF9F27" stroke-width="1" />
<text x="545" y="180" font-size="14" font-weight="600" fill="#FAC775" text-anchor="middle">market_db</text>
<text x="545" y="200" font-size="12" fill="#EF9F27" text-anchor="middle">Marktpreise</text>
<text x="545" y="218" font-size="12" fill="#EF9F27" text-anchor="middle">gecrawlt · erst bestätigen</text>
<text x="340" y="268" font-size="11" fill="#9E9D98" text-anchor="middle">Agenten können die offizielle Basis nie überschreiben — Lern- &amp;amp; Marktdaten nur nach Bestätigung</text>
</svg>