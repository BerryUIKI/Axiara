<svg viewBox="0 0 1280 620" width="100%" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Axiara setup decision tree</title>
<desc>Onboarding choices: language → storage &amp; sync → data source → dev environment</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- Header -->
<rect x="40" y="20" width="1200" height="50" rx="12" fill="#04342C" stroke="#5DCAA5" stroke-width="1"/>
<text x="640" y="50" font-size="17" font-weight="600" fill="#E1F5EE" text-anchor="middle">Axiara Setup — Four Quick Choices</text>

<!-- ============ Step 1 — Language ============ -->
<text x="640" y="92" font-size="13" font-weight="600" fill="#E1F5EE" text-anchor="middle">1 · Interface language</text>
<rect x="40" y="102" width="1200" height="52" rx="10" fill="#0E2402" stroke="#618D3A" stroke-width="1"/>
<text x="640" y="122" font-size="13" fill="#C0DD97" text-anchor="middle">English · 简体中文 · 繁體中文 · 日本語 · 한국어 · Français</text>
<text x="640" y="142" font-size="13" fill="#97C459" text-anchor="middle">Deutsch · Español · Português · Русский</text>
<line x1="640" y1="158" x2="640" y2="180" stroke="#9E9D98" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- ============ Step 2 — Storage & sync ============ -->
<text x="640" y="200" font-size="13" font-weight="600" fill="#E1F5EE" text-anchor="middle">2 · Storage &amp; sync — do you need team sync?</text>

<line x1="640" y1="214" x2="230" y2="240" stroke="#9E9D98" stroke-width="1.5"/>
<line x1="640" y1="214" x2="640" y2="240" stroke="#9E9D98" stroke-width="1.5"/>
<line x1="640" y1="214" x2="1050" y2="240" stroke="#9E9D98" stroke-width="1.5"/>

<rect x="40" y="244" width="380" height="74" rx="10" fill="#173404" stroke="#97C459" stroke-width="1"/>
<text x="230" y="268" font-size="14" font-weight="600" fill="#C0DD97" text-anchor="middle">No — personal</text>
<text x="230" y="288" font-size="12" fill="#97C459" text-anchor="middle">SQLite · zero config</text>
<text x="230" y="306" font-size="12" fill="#97C459" text-anchor="middle">single-file database</text>

<rect x="450" y="244" width="380" height="74" rx="10" fill="#26215C" stroke="#AFA9EC" stroke-width="1"/>
<text x="640" y="268" font-size="14" font-weight="600" fill="#CECBF6" text-anchor="middle">Yes — text + Git</text>
<text x="640" y="288" font-size="12" fill="#AFA9EC" text-anchor="middle">CSV files synced via git</text>
<text x="640" y="306" font-size="12" fill="#AFA9EC" text-anchor="middle">no server · local SQLite cache</text>

<rect x="860" y="244" width="380" height="74" rx="10" fill="#412402" stroke="#EF9F27" stroke-width="1"/>
<text x="1050" y="268" font-size="14" font-weight="600" fill="#FAC775" text-anchor="middle">Yes — SQL server</text>
<text x="1050" y="288" font-size="12" fill="#EF9F27" text-anchor="middle">MySQL · MariaDB · PostgreSQL</text>
<text x="1050" y="306" font-size="12" fill="#EF9F27" text-anchor="middle">needs a connection string</text>

<line x1="230" y1="322" x2="230" y2="348" stroke="#9E9D98" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="640" y1="322" x2="640" y2="348" stroke="#9E9D98" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="1050" y1="322" x2="1050" y2="348" stroke="#9E9D98" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- ============ Step 3 — Data source ============ -->
<text x="640" y="368" font-size="13" font-weight="600" fill="#E1F5EE" text-anchor="middle">3 · Data source</text>

<line x1="230" y1="378" x2="230" y2="400" stroke="#9E9D98" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="640" y1="378" x2="640" y2="400" stroke="#9E9D98" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="1050" y1="378" x2="1050" y2="400" stroke="#9E9D98" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="404" width="380" height="62" rx="10" fill="#0E2402" stroke="#618D3A" stroke-width="1"/>
<text x="230" y="428" font-size="14" font-weight="600" fill="#C0DD97" text-anchor="middle">Local files</text>
<text x="230" y="448" font-size="12" fill="#97C459" text-anchor="middle">import price lists (Excel / CSV)</text>

<rect x="450" y="404" width="380" height="62" rx="10" fill="#1C1848" stroke="#7A71C9" stroke-width="1"/>
<text x="640" y="428" font-size="14" font-weight="600" fill="#CECBF6" text-anchor="middle">Team repo</text>
<text x="640" y="448" font-size="12" fill="#AFA9EC" text-anchor="middle">enter repo URL → clone to store/</text>

<rect x="860" y="404" width="380" height="62" rx="10" fill="#2F1B02" stroke="#B97B2A" stroke-width="1"/>
<text x="1050" y="428" font-size="14" font-weight="600" fill="#FAC775" text-anchor="middle">No data yet</text>
<text x="1050" y="448" font-size="12" fill="#EF9F27" text-anchor="middle">start empty, fetch later</text>

<line x1="230" y1="470" x2="230" y2="496" stroke="#9E9D98" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="640" y1="470" x2="640" y2="496" stroke="#9E9D98" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="1050" y1="470" x2="1050" y2="496" stroke="#9E9D98" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- ============ Step 4 — Dev environment ============ -->
<text x="640" y="516" font-size="13" font-weight="600" fill="#E1F5EE" text-anchor="middle">4 · Dev environment (optional)</text>

<line x1="425" y1="526" x2="425" y2="548" stroke="#9E9D98" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="855" y1="526" x2="855" y2="548" stroke="#9E9D98" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="160" y="552" width="530" height="50" rx="10" fill="#04342C" stroke="#5DCAA5" stroke-width="1"/>
<text x="425" y="572" font-size="14" font-weight="600" fill="#E1F5EE" text-anchor="middle">Agent-only (recommended, zero setup)</text>
<text x="425" y="592" font-size="12" fill="#9FE1CB" text-anchor="middle">your AI agent handles everything</text>

<rect x="590" y="552" width="530" height="50" rx="10" fill="#412402" stroke="#EF9F27" stroke-width="1"/>
<text x="855" y="572" font-size="14" font-weight="600" fill="#FAC775" text-anchor="middle">With dev environment</text>
<text x="855" y="592" font-size="12" fill="#EF9F27" text-anchor="middle">uv sync → REST API · CLI · tests</text>
</svg>
