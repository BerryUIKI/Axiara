<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 660" width="100%" role="img">
<title>Axiara four modes</title>
<desc>Four modes: Archive (Mode 1), Query (Mode 2), Quote (Mode 3), Review (Mode 4) — each with input, process and output</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
</marker>
</defs>


<rect x="40" y="20" width="1200" height="56" rx="12" fill="#04342C" stroke="#5DCAA5" stroke-width="1" />
<text x="640" y="48" font-size="28" font-weight="600" fill="#E1F5EE" text-anchor="middle">4つのモード — Axiara ができること</text>
<text x="640" y="68" font-size="14" fill="#9FE1CB" text-anchor="middle">エージェントはタスクごとにモードを選択。各モードは機能と権限の境界</text>


<rect x="40" y="92" width="280" height="56" rx="10" fill="#173404" stroke="#97C459" stroke-width="1" />
<text x="180" y="118" font-size="22" font-weight="600" fill="#C0DD97" text-anchor="middle">モード1 — アーカイブ</text>
<text x="180" y="140" font-size="14" fill="#97C459" text-anchor="middle">公式価格入力 · 学習 · クロール</text>

<text x="180" y="166" font-size="14" font-weight="600" fill="#9E9D98" text-anchor="middle">入力</text>
<rect x="40" y="176" width="280" height="88" rx="10" fill="#0E2402" stroke="#618D3A" stroke-width="1" />
<text x="180" y="200" font-size="16" fill="#C0DD97" text-anchor="middle">価格表 · ドキュメント</text>
<text x="180" y="226" font-size="16" fill="#C0DD97" text-anchor="middle">過去の見積もり</text>
<text x="180" y="252" font-size="16" fill="#97C459" text-anchor="middle">クロール対象URL</text>

<line x1="180" y1="270" x2="180" y2="292" stroke="#9E9D98" stroke-width="1.5" marker-end="url(#arrow)" />
<text x="180" y="310" font-size="14" font-weight="600" fill="#9E9D98" text-anchor="middle">処理</text>
<rect x="40" y="320" width="280" height="112" rx="10" fill="#173404" stroke="#97C459" stroke-width="1" />
<text x="180" y="344" font-size="16" fill="#C0DD97" text-anchor="middle">手動入力（バージョン付き、</text>
<text x="180" y="370" font-size="16" fill="#C0DD97" text-anchor="middle">ロールバック可）</text>
<text x="180" y="396" font-size="16" fill="#97C459" text-anchor="middle">ドキュメントからAI学習</text>
<text x="180" y="422" font-size="16" fill="#97C459" text-anchor="middle">オンデマンドで市場クロール</text>

<line x1="180" y1="438" x2="180" y2="460" stroke="#9E9D98" stroke-width="1.5" marker-end="url(#arrow)" />
<text x="180" y="478" font-size="14" font-weight="600" fill="#9E9D98" text-anchor="middle">出力</text>
<rect x="40" y="488" width="280" height="88" rx="10" fill="#0E2402" stroke="#618D3A" stroke-width="1" />
<text x="180" y="512" font-size="16" fill="#C0DD97" text-anchor="middle">main_db · learn_db</text>
<text x="180" y="538" font-size="16" fill="#97C459" text-anchor="middle">market_db（確認後）</text>


<rect x="340" y="92" width="280" height="56" rx="10" fill="#26215C" stroke="#AFA9EC" stroke-width="1" />
<text x="480" y="118" font-size="22" font-weight="600" fill="#CECBF6" text-anchor="middle">モード2 — クエリ</text>
<text x="480" y="140" font-size="14" fill="#AFA9EC" text-anchor="middle">単品詳細の照会</text>

<text x="480" y="166" font-size="14" font-weight="600" fill="#9E9D98" text-anchor="middle">入力</text>
<rect x="340" y="176" width="280" height="88" rx="10" fill="#1C1848" stroke="#7A71C9" stroke-width="1" />
<text x="480" y="200" font-size="16" fill="#CECBF6" text-anchor="middle">材料 / 製品名</text>
<text x="480" y="226" font-size="16" fill="#CECBF6" text-anchor="middle">（+ 数量 / 単位）</text>
<text x="480" y="252" font-size="16" fill="#AFA9EC" text-anchor="middle">仕様 / メモ一致</text>

<line x1="480" y1="270" x2="480" y2="292" stroke="#9E9D98" stroke-width="1.5" marker-end="url(#arrow)" />
<text x="480" y="310" font-size="14" font-weight="600" fill="#9E9D98" text-anchor="middle">処理</text>
<rect x="340" y="320" width="280" height="112" rx="10" fill="#26215C" stroke="#AFA9EC" stroke-width="1" />
<text x="480" y="344" font-size="16" fill="#CECBF6" text-anchor="middle">まず main_db の原価を参照</text>
<text x="480" y="370" font-size="16" fill="#CECBF6" text-anchor="middle">（最優先）</text>
<text x="480" y="396" font-size="16" fill="#AFA9EC" text-anchor="middle">market_db を重ねる</text>
<text x="480" y="422" font-size="16" fill="#AFA9EC" text-anchor="middle">変動価格レンジ</text>

<line x1="480" y1="438" x2="480" y2="460" stroke="#9E9D98" stroke-width="1.5" marker-end="url(#arrow)" />
<text x="480" y="478" font-size="14" font-weight="600" fill="#9E9D98" text-anchor="middle">出力</text>
<rect x="340" y="488" width="280" height="88" rx="10" fill="#1C1848" stroke="#7A71C9" stroke-width="1" />
<text x="480" y="512" font-size="16" fill="#CECBF6" text-anchor="middle">標準原価 + 市場</text>
<text x="480" y="538" font-size="16" fill="#AFA9EC" text-anchor="middle">参考 + 工程メモ</text>


<rect x="640" y="92" width="280" height="56" rx="10" fill="#412402" stroke="#EF9F27" stroke-width="1" />
<text x="780" y="118" font-size="22" font-weight="600" fill="#FAC775" text-anchor="middle">モード3 — 見積</text>
<text x="780" y="140" font-size="14" fill="#EF9F27" text-anchor="middle">BOM 一括補填 · スマート見積</text>

<text x="780" y="166" font-size="14" font-weight="600" fill="#9E9D98" text-anchor="middle">入力</text>
<rect x="640" y="176" width="280" height="88" rx="10" fill="#2F1B02" stroke="#B97B2A" stroke-width="1" />
<text x="780" y="200" font-size="16" fill="#FAC775" text-anchor="middle">BOM / 材料リスト</text>
<text x="780" y="226" font-size="16" fill="#FAC775" text-anchor="middle">制約（デフォルト /</text>
<text x="780" y="252" font-size="16" fill="#EF9F27" text-anchor="middle">プロジェクト）</text>

<line x1="780" y1="270" x2="780" y2="292" stroke="#9E9D98" stroke-width="1.5" marker-end="url(#arrow)" />
<text x="780" y="310" font-size="14" font-weight="600" fill="#9E9D98" text-anchor="middle">処理</text>
<rect x="640" y="320" width="280" height="112" rx="10" fill="#412402" stroke="#EF9F27" stroke-width="1" />
<text x="780" y="344" font-size="16" fill="#FAC775" text-anchor="middle">原価計算</text>
<text x="780" y="370" font-size="16" fill="#FAC775" text-anchor="middle">3段階価格</text>
<text x="780" y="396" font-size="16" fill="#EF9F27" text-anchor="middle">（低 / 中 / 高）</text>
<text x="780" y="422" font-size="16" fill="#EF9F27" text-anchor="middle">テンプレート適応</text>

<line x1="780" y1="438" x2="780" y2="460" stroke="#9E9D98" stroke-width="1.5" marker-end="url(#arrow)" />
<text x="780" y="478" font-size="14" font-weight="600" fill="#9E9D98" text-anchor="middle">出力</text>
<rect x="640" y="488" width="280" height="88" rx="10" fill="#2F1B02" stroke="#B97B2A" stroke-width="1" />
<text x="780" y="512" font-size="16" fill="#FAC775" text-anchor="middle">見積書を output/ へ</text>
<text x="780" y="538" font-size="16" fill="#EF9F27" text-anchor="middle">（デフォルト / ユーザーテンプレート）</text>


<rect x="940" y="92" width="280" height="56" rx="10" fill="#04342C" stroke="#5DCAA5" stroke-width="1" />
<text x="1080" y="118" font-size="22" font-weight="600" fill="#E1F5EE" text-anchor="middle">モード4 — レビュー</text>
<text x="1080" y="140" font-size="14" fill="#9FE1CB" text-anchor="middle">ユーザー表をクロス検証</text>

<text x="1080" y="166" font-size="14" font-weight="600" fill="#9E9D98" text-anchor="middle">入力</text>
<rect x="940" y="176" width="280" height="88" rx="10" fill="#04241C" stroke="#3E9C7D" stroke-width="1" />
<text x="1080" y="200" font-size="16" fill="#E1F5EE" text-anchor="middle">ユーザーの原価 /</text>
<text x="1080" y="226" font-size="16" fill="#E1F5EE" text-anchor="middle">見積表</text>
<text x="1080" y="252" font-size="16" fill="#9FE1CB" text-anchor="middle">（メモ付き）</text>

<line x1="1080" y1="270" x2="1080" y2="292" stroke="#9E9D98" stroke-width="1.5" marker-end="url(#arrow)" />
<text x="1080" y="310" font-size="14" font-weight="600" fill="#9E9D98" text-anchor="middle">処理</text>
<rect x="940" y="320" width="280" height="112" rx="10" fill="#04342C" stroke="#5DCAA5" stroke-width="1" />
<text x="1080" y="344" font-size="16" fill="#E1F5EE" text-anchor="middle">main_db + market_db と</text>
<text x="1080" y="370" font-size="16" fill="#E1F5EE" text-anchor="middle">クロス検証</text>
<text x="1080" y="396" font-size="16" fill="#9FE1CB" text-anchor="middle">異常価格を検出</text>
<text x="1080" y="422" font-size="16" fill="#9FE1CB" text-anchor="middle">（高すぎ / 低すぎ）</text>

<line x1="1080" y1="438" x2="1080" y2="460" stroke="#9E9D98" stroke-width="1.5" marker-end="url(#arrow)" />
<text x="1080" y="478" font-size="14" font-weight="600" fill="#9E9D98" text-anchor="middle">出力</text>
<rect x="940" y="488" width="280" height="88" rx="10" fill="#04241C" stroke="#3E9C7D" stroke-width="1" />
<text x="1080" y="512" font-size="16" fill="#E1F5EE" text-anchor="middle">異常フラグ +</text>
<text x="1080" y="538" font-size="16" fill="#9FE1CB" text-anchor="middle">調整提案</text>

<text x="640" y="616" font-size="14" fill="#9E9D98" text-anchor="middle">公式ベースラインは書き込まず — 学習・市場データは確認後にのみ登録</text>
</svg>