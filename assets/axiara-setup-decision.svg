<svg viewBox="0 0 1280 700" width="100%" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Axiara setup decision tree</title>
<desc>Onboarding choices: language → storage &amp; sync → data source → dev environment</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- Header -->
<rect x="40" y="20" width="1200" height="60" rx="12" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
<text x="640" y="57" font-size="28" font-weight="600" fill="#04342C" text-anchor="middle">Axiara Setup — Four Quick Choices</text>

<!-- ============ Step 1 — Language ============ -->
<text x="640" y="106" font-size="22" font-weight="600" fill="#04342C" text-anchor="middle">1 · Interface language</text>
<rect x="40" y="118" width="1200" height="60" rx="10" fill="#F6F9EE" stroke="#A8C97E" stroke-width="1"/>
<text x="640" y="142" font-size="20" fill="#27500A" text-anchor="middle">English · 简体中文 · 繁體中文 · 日本語 · 한국어 · Français</text>
<text x="640" y="168" font-size="20" fill="#3B6D11" text-anchor="middle">Deutsch · Español · Português · Русский</text>
<line x1="640" y1="182" x2="640" y2="208" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- ============ Step 2 — Storage & sync ============ -->
<text x="640" y="230" font-size="22" font-weight="600" fill="#04342C" text-anchor="middle">2 · Storage &amp; sync — do you need team sync?</text>

<line x1="640" y1="244" x2="230" y2="272" stroke="#888780" stroke-width="1.5"/>
<line x1="640" y1="244" x2="640" y2="272" stroke="#888780" stroke-width="1.5"/>
<line x1="640" y1="244" x2="1050" y2="272" stroke="#888780" stroke-width="1.5"/>

<rect x="40" y="276" width="380" height="92" rx="10" fill="#EAF3DE" stroke="#639922" stroke-width="1"/>
<text x="230" y="306" font-size="22" font-weight="600" fill="#27500A" text-anchor="middle">No — personal</text>
<text x="230" y="336" font-size="18" fill="#3B6D11" text-anchor="middle">SQLite · zero config</text>
<text x="230" y="360" font-size="18" fill="#3B6D11" text-anchor="middle">single-file database</text>

<rect x="450" y="276" width="380" height="92" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
<text x="640" y="306" font-size="22" font-weight="600" fill="#3C3489" text-anchor="middle">Yes — text + Git</text>
<text x="640" y="336" font-size="18" fill="#534AB7" text-anchor="middle">CSV files synced via git</text>
<text x="640" y="360" font-size="18" fill="#534AB7" text-anchor="middle">no server · local cache</text>

<rect x="860" y="276" width="380" height="92" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
<text x="1050" y="306" font-size="22" font-weight="600" fill="#633806" text-anchor="middle">Yes — SQL server</text>
<text x="1050" y="336" font-size="18" fill="#854F0B" text-anchor="middle">MySQL · MariaDB ·</text>
<text x="1050" y="360" font-size="18" fill="#854F0B" text-anchor="middle">PostgreSQL (DSN)</text>

<line x1="230" y1="372" x2="230" y2="398" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="640" y1="372" x2="640" y2="398" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="1050" y1="372" x2="1050" y2="398" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- ============ Step 3 — Data source ============ -->
<text x="640" y="420" font-size="22" font-weight="600" fill="#04342C" text-anchor="middle">3 · Data source</text>

<line x1="230" y1="432" x2="230" y2="456" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="640" y1="432" x2="640" y2="456" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="1050" y1="432" x2="1050" y2="456" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="460" width="380" height="76" rx="10" fill="#F6F9EE" stroke="#A8C97E" stroke-width="1"/>
<text x="230" y="490" font-size="22" font-weight="600" fill="#27500A" text-anchor="middle">Local files</text>
<text x="230" y="518" font-size="18" fill="#3B6D11" text-anchor="middle">import price lists (Excel / CSV)</text>

<rect x="450" y="460" width="380" height="76" rx="10" fill="#F7F6FE" stroke="#B3ADEB" stroke-width="1"/>
<text x="640" y="490" font-size="22" font-weight="600" fill="#3C3489" text-anchor="middle">Team repo</text>
<text x="640" y="518" font-size="18" fill="#534AB7" text-anchor="middle">repo URL → clone to store/</text>

<rect x="860" y="460" width="380" height="76" rx="10" fill="#FDF6EA" stroke="#D6A96B" stroke-width="1"/>
<text x="1050" y="490" font-size="22" font-weight="600" fill="#633806" text-anchor="middle">No data yet</text>
<text x="1050" y="518" font-size="18" fill="#854F0B" text-anchor="middle">start empty, fetch later</text>

<line x1="230" y1="540" x2="230" y2="566" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="640" y1="540" x2="640" y2="566" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="1050" y1="540" x2="1050" y2="566" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- ============ Step 4 — Dev environment ============ -->
<text x="640" y="588" font-size="22" font-weight="600" fill="#04342C" text-anchor="middle">4 · Dev environment (optional)</text>

<line x1="425" y1="600" x2="425" y2="624" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="855" y1="600" x2="855" y2="624" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="160" y="628" width="530" height="58" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
<text x="425" y="654" font-size="20" font-weight="600" fill="#04342C" text-anchor="middle">Agent-only (recommended, zero setup)</text>
<text x="425" y="678" font-size="16" fill="#0F6E56" text-anchor="middle">your AI agent handles everything</text>

<rect x="590" y="628" width="530" height="58" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
<text x="855" y="654" font-size="20" font-weight="600" fill="#633806" text-anchor="middle">With dev environment</text>
<text x="855" y="678" font-size="16" fill="#854F0B" text-anchor="middle">uv sync → REST API · CLI · tests</text>
</svg>
