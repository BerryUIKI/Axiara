<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 660" width="100%" role="img">
<title>Axiara four modes</title>
<desc>Four modes: Archive (Mode 1), Query (Mode 2), Quote (Mode 3), Review (Mode 4) — each with input, process and output</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
</marker>
</defs>


<rect x="40" y="20" width="1200" height="56" rx="12" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1" />
<text x="640" y="48" font-size="28" font-weight="600" fill="#04342C" text-anchor="middle">Четыре режима — что умеет Axiara</text>
<text x="640" y="68" font-size="14" fill="#0F6E56" text-anchor="middle">Агент выбирает режим под задачу; каждый режим — это граница возможностей и прав</text>


<rect x="40" y="92" width="280" height="56" rx="10" fill="#EAF3DE" stroke="#639922" stroke-width="1" />
<text x="180" y="118" font-size="22" font-weight="600" fill="#27500A" text-anchor="middle">Режим 1 — Архив</text>
<text x="180" y="140" font-size="14" fill="#3B6D11" text-anchor="middle">официальные цены · обучение · сбор</text>

<text x="180" y="166" font-size="14" font-weight="600" fill="#888780" text-anchor="middle">ВХОД</text>
<rect x="40" y="176" width="280" height="88" rx="10" fill="#F6F9EE" stroke="#A8C97E" stroke-width="1" />
<text x="180" y="200" font-size="16" fill="#27500A" text-anchor="middle">Прайс-листы · документы</text>
<text x="180" y="226" font-size="16" fill="#27500A" text-anchor="middle">исторические расценки</text>
<text x="180" y="252" font-size="16" fill="#3B6D11" text-anchor="middle">URL для сбора</text>

<line x1="180" y1="270" x2="180" y2="292" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)" />
<text x="180" y="310" font-size="14" font-weight="600" fill="#888780" text-anchor="middle">ОБРАБОТКА</text>
<rect x="40" y="320" width="280" height="112" rx="10" fill="#EAF3DE" stroke="#639922" stroke-width="1" />
<text x="180" y="344" font-size="16" fill="#27500A" text-anchor="middle">Ручной ввод (с версиями,</text>
<text x="180" y="370" font-size="16" fill="#27500A" text-anchor="middle">откат возможен)</text>
<text x="180" y="396" font-size="16" fill="#3B6D11" text-anchor="middle">ИИ-обучение по документам</text>
<text x="180" y="422" font-size="16" fill="#3B6D11" text-anchor="middle">Сбор рынка по требованию</text>

<line x1="180" y1="438" x2="180" y2="460" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)" />
<text x="180" y="478" font-size="14" font-weight="600" fill="#888780" text-anchor="middle">ВЫХОД</text>
<rect x="40" y="488" width="280" height="88" rx="10" fill="#F6F9EE" stroke="#A8C97E" stroke-width="1" />
<text x="180" y="512" font-size="16" fill="#27500A" text-anchor="middle">main_db · learn_db</text>
<text x="180" y="538" font-size="16" fill="#3B6D11" text-anchor="middle">market_db (сначала подтвердить)</text>


<rect x="340" y="92" width="280" height="56" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1" />
<text x="480" y="118" font-size="22" font-weight="600" fill="#3C3489" text-anchor="middle">Режим 2 — Запрос</text>
<text x="480" y="140" font-size="14" fill="#534AB7" text-anchor="middle">детальный запрос по позиции</text>

<text x="480" y="166" font-size="14" font-weight="600" fill="#888780" text-anchor="middle">ВХОД</text>
<rect x="340" y="176" width="280" height="88" rx="10" fill="#F7F6FE" stroke="#B3ADEB" stroke-width="1" />
<text x="480" y="200" font-size="16" fill="#3C3489" text-anchor="middle">Материал / продукт</text>
<text x="480" y="226" font-size="16" fill="#3C3489" text-anchor="middle">название (+ кол-во / ед.)</text>
<text x="480" y="252" font-size="16" fill="#534AB7" text-anchor="middle">характеристики / примечания</text>

<line x1="480" y1="270" x2="480" y2="292" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)" />
<text x="480" y="310" font-size="14" font-weight="600" fill="#888780" text-anchor="middle">ОБРАБОТКА</text>
<rect x="340" y="320" width="280" height="112" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1" />
<text x="480" y="344" font-size="16" fill="#3C3489" text-anchor="middle">Сначала стоимость из main_db</text>
<text x="480" y="370" font-size="16" fill="#3C3489" text-anchor="middle">(наивысший приоритет)</text>
<text x="480" y="396" font-size="16" fill="#534AB7" text-anchor="middle">Наложить market_db</text>
<text x="480" y="422" font-size="16" fill="#534AB7" text-anchor="middle">плавающий диапазон цен</text>

<line x1="480" y1="438" x2="480" y2="460" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)" />
<text x="480" y="478" font-size="14" font-weight="600" fill="#888780" text-anchor="middle">ВЫХОД</text>
<rect x="340" y="488" width="280" height="88" rx="10" fill="#F7F6FE" stroke="#B3ADEB" stroke-width="1" />
<text x="480" y="512" font-size="16" fill="#3C3489" text-anchor="middle">Стандарт + рынок</text>
<text x="480" y="538" font-size="16" fill="#534AB7" text-anchor="middle">справка + технологические заметки</text>


<rect x="640" y="92" width="280" height="56" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="1" />
<text x="780" y="118" font-size="22" font-weight="600" fill="#633806" text-anchor="middle">Режим 3 — Расценка</text>
<text x="780" y="140" font-size="14" fill="#854F0B" text-anchor="middle">пакетное заполнение BOM · умная расценка</text>

<text x="780" y="166" font-size="14" font-weight="600" fill="#888780" text-anchor="middle">ВХОД</text>
<rect x="640" y="176" width="280" height="88" rx="10" fill="#FDF6EA" stroke="#D6A96B" stroke-width="1" />
<text x="780" y="200" font-size="16" fill="#633806" text-anchor="middle">BOM / список материалов</text>
<text x="780" y="226" font-size="16" fill="#633806" text-anchor="middle">ограничения (по умолчанию /</text>
<text x="780" y="252" font-size="16" fill="#854F0B" text-anchor="middle">проект)</text>

<line x1="780" y1="270" x2="780" y2="292" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)" />
<text x="780" y="310" font-size="14" font-weight="600" fill="#888780" text-anchor="middle">ОБРАБОТКА</text>
<rect x="640" y="320" width="280" height="112" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="1" />
<text x="780" y="344" font-size="16" fill="#633806" text-anchor="middle">Расчёт стоимости</text>
<text x="780" y="370" font-size="16" fill="#633806" text-anchor="middle">Трёхуровневое ценообразование</text>
<text x="780" y="396" font-size="16" fill="#854F0B" text-anchor="middle">(низкий / средний / высокий)</text>
<text x="780" y="422" font-size="16" fill="#854F0B" text-anchor="middle">Адаптация шаблона</text>

<line x1="780" y1="438" x2="780" y2="460" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)" />
<text x="780" y="478" font-size="14" font-weight="600" fill="#888780" text-anchor="middle">ВЫХОД</text>
<rect x="640" y="488" width="280" height="88" rx="10" fill="#FDF6EA" stroke="#D6A96B" stroke-width="1" />
<text x="780" y="512" font-size="16" fill="#633806" text-anchor="middle">Расценка в output/</text>
<text x="780" y="538" font-size="16" fill="#854F0B" text-anchor="middle">(шаблон по умолчанию или пользователя)</text>


<rect x="940" y="92" width="280" height="56" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1" />
<text x="1080" y="118" font-size="22" font-weight="600" fill="#04342C" text-anchor="middle">Режим 4 — Проверка</text>
<text x="1080" y="140" font-size="14" fill="#0F6E56" text-anchor="middle">перекрёстная проверка таблиц пользователя</text>

<text x="1080" y="166" font-size="14" font-weight="600" fill="#888780" text-anchor="middle">ВХОД</text>
<rect x="940" y="176" width="280" height="88" rx="10" fill="#EFFAF6" stroke="#6EC6A6" stroke-width="1" />
<text x="1080" y="200" font-size="16" fill="#04342C" text-anchor="middle">Своя стоимость /</text>
<text x="1080" y="226" font-size="16" fill="#04342C" text-anchor="middle">таблица расценок</text>
<text x="1080" y="252" font-size="16" fill="#0F6E56" text-anchor="middle">(с примечаниями)</text>

<line x1="1080" y1="270" x2="1080" y2="292" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)" />
<text x="1080" y="310" font-size="14" font-weight="600" fill="#888780" text-anchor="middle">ОБРАБОТКА</text>
<rect x="940" y="320" width="280" height="112" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1" />
<text x="1080" y="344" font-size="16" fill="#04342C" text-anchor="middle">Сверка с</text>
<text x="1080" y="370" font-size="16" fill="#04342C" text-anchor="middle">main_db + market_db</text>
<text x="1080" y="396" font-size="16" fill="#0F6E56" text-anchor="middle">Отмечать аномальные цены</text>
<text x="1080" y="422" font-size="16" fill="#0F6E56" text-anchor="middle">(слишком высокие / низкие)</text>

<line x1="1080" y1="438" x2="1080" y2="460" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)" />
<text x="1080" y="478" font-size="14" font-weight="600" fill="#888780" text-anchor="middle">ВЫХОД</text>
<rect x="940" y="488" width="280" height="88" rx="10" fill="#EFFAF6" stroke="#6EC6A6" stroke-width="1" />
<text x="1080" y="512" font-size="16" fill="#04342C" text-anchor="middle">Флаги аномалий +</text>
<text x="1080" y="538" font-size="16" fill="#0F6E56" text-anchor="middle">предложения по корректировке</text>

<text x="640" y="616" font-size="14" fill="#888780" text-anchor="middle">Никогда не перезаписывает официальную базу — обученные и рыночные данные входят только после подтверждения</text>
</svg>