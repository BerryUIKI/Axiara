<svg viewBox="0 0 1280 700" width="100%" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Axiara 初始化决策树</title>
<desc>初始化选择：语言 → 存储与同步 → 数据来源 → 开发环境</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- Header -->
<rect x="40" y="20" width="1200" height="60" rx="12" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
<text x="640" y="57" font-size="28" font-weight="600" fill="#04342C" text-anchor="middle">Axiara 初始化 — 四个简单选择</text>

<!-- ============ 第 1 步 — 语言 ============ -->
<text x="640" y="106" font-size="22" font-weight="600" fill="#04342C" text-anchor="middle">1 · 界面语言</text>
<rect x="40" y="118" width="1200" height="60" rx="10" fill="#F6F9EE" stroke="#A8C97E" stroke-width="1"/>
<text x="640" y="142" font-size="20" fill="#27500A" text-anchor="middle">简体中文 · 繁體中文 · English · 日本語 · 한국어</text>
<text x="640" y="168" font-size="20" fill="#3B6D11" text-anchor="middle">Français · Deutsch · Español · Português · Русский</text>
<line x1="640" y1="182" x2="640" y2="208" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- ============ 第 2 步 — 存储与同步 ============ -->
<text x="640" y="230" font-size="22" font-weight="600" fill="#04342C" text-anchor="middle">2 · 存储与同步 — 需要团队同步吗？</text>

<line x1="640" y1="244" x2="230" y2="272" stroke="#888780" stroke-width="1.5"/>
<line x1="640" y1="244" x2="640" y2="272" stroke="#888780" stroke-width="1.5"/>
<line x1="640" y1="244" x2="1050" y2="272" stroke="#888780" stroke-width="1.5"/>

<rect x="40" y="276" width="380" height="92" rx="10" fill="#EAF3DE" stroke="#639922" stroke-width="1"/>
<text x="230" y="306" font-size="22" font-weight="600" fill="#27500A" text-anchor="middle">不需要 — 个人使用</text>
<text x="230" y="336" font-size="18" fill="#3B6D11" text-anchor="middle">SQLite · 零配置</text>
<text x="230" y="360" font-size="18" fill="#3B6D11" text-anchor="middle">单文件数据库</text>

<rect x="450" y="276" width="380" height="92" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
<text x="640" y="306" font-size="22" font-weight="600" fill="#3C3489" text-anchor="middle">需要 — 文本 + Git</text>
<text x="640" y="336" font-size="18" fill="#534AB7" text-anchor="middle">CSV 文件经 git 同步</text>
<text x="640" y="360" font-size="18" fill="#534AB7" text-anchor="middle">免服务器 · 本地缓存</text>

<rect x="860" y="276" width="380" height="92" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
<text x="1050" y="306" font-size="22" font-weight="600" fill="#633806" text-anchor="middle">需要 — SQL 服务器</text>
<text x="1050" y="336" font-size="18" fill="#854F0B" text-anchor="middle">MySQL · MariaDB ·</text>
<text x="1050" y="360" font-size="18" fill="#854F0B" text-anchor="middle">PostgreSQL（DSN）</text>

<line x1="230" y1="372" x2="230" y2="398" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="640" y1="372" x2="640" y2="398" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="1050" y1="372" x2="1050" y2="398" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- ============ 第 3 步 — 数据来源 ============ -->
<text x="640" y="420" font-size="22" font-weight="600" fill="#04342C" text-anchor="middle">3 · 数据来源</text>

<line x1="230" y1="432" x2="230" y2="456" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="640" y1="432" x2="640" y2="456" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="1050" y1="432" x2="1050" y2="456" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="460" width="380" height="76" rx="10" fill="#F6F9EE" stroke="#A8C97E" stroke-width="1"/>
<text x="230" y="490" font-size="22" font-weight="600" fill="#27500A" text-anchor="middle">本地文件</text>
<text x="230" y="518" font-size="18" fill="#3B6D11" text-anchor="middle">导入价目表（Excel / CSV）</text>

<rect x="450" y="460" width="380" height="76" rx="10" fill="#F7F6FE" stroke="#B3ADEB" stroke-width="1"/>
<text x="640" y="490" font-size="22" font-weight="600" fill="#3C3489" text-anchor="middle">团队仓库</text>
<text x="640" y="518" font-size="18" fill="#534AB7" text-anchor="middle">仓库 URL → 克隆到 store/</text>

<rect x="860" y="460" width="380" height="76" rx="10" fill="#FDF6EA" stroke="#D6A96B" stroke-width="1"/>
<text x="1050" y="490" font-size="22" font-weight="600" fill="#633806" text-anchor="middle">暂无数据</text>
<text x="1050" y="518" font-size="18" fill="#854F0B" text-anchor="middle">空数据起步，之后按需抓取</text>

<line x1="230" y1="540" x2="230" y2="566" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="640" y1="540" x2="640" y2="566" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="1050" y1="540" x2="1050" y2="566" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- ============ 第 4 步 — 开发环境 ============ -->
<text x="640" y="588" font-size="22" font-weight="600" fill="#04342C" text-anchor="middle">4 · 开发环境（可选）</text>

<line x1="425" y1="600" x2="425" y2="624" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="855" y1="600" x2="855" y2="624" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="160" y="628" width="530" height="58" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
<text x="425" y="654" font-size="20" font-weight="600" fill="#04342C" text-anchor="middle">只用 AI Agent（推荐，零配置）</text>
<text x="425" y="678" font-size="16" fill="#0F6E56" text-anchor="middle">你的 AI 助手全权处理</text>

<rect x="590" y="628" width="530" height="58" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
<text x="855" y="654" font-size="20" font-weight="600" fill="#633806" text-anchor="middle">配置开发环境</text>
<text x="855" y="678" font-size="16" fill="#854F0B" text-anchor="middle">uv sync → REST API · CLI · 测试</text>
</svg>
