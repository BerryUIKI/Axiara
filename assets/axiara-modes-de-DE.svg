<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 660" width="100%" role="img">
<title>Axiara four modes</title>
<desc>Four modes: Archive (Mode 1), Query (Mode 2), Quote (Mode 3), Review (Mode 4) — each with input, process and output</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
</marker>
</defs>


<rect x="40" y="20" width="1200" height="56" rx="12" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1" />
<text x="640" y="48" font-size="28" font-weight="600" fill="#04342C" text-anchor="middle">Vier Modi — was Axiara kann</text>
<text x="640" y="68" font-size="14" fill="#0F6E56" text-anchor="middle">Agenten wählen je Aufgabe einen Modus; jeder Modus ist eine Fähigkeits- &amp;amp; Berechtigungsgrenze</text>


<rect x="40" y="92" width="280" height="56" rx="10" fill="#EAF3DE" stroke="#639922" stroke-width="1" />
<text x="180" y="118" font-size="22" font-weight="600" fill="#27500A" text-anchor="middle">Modus 1 — Archiv</text>
<text x="180" y="140" font-size="14" fill="#3B6D11" text-anchor="middle">offizielle Preise · lernen · crawlen</text>

<text x="180" y="166" font-size="14" font-weight="600" fill="#888780" text-anchor="middle">EINGABE</text>
<rect x="40" y="176" width="280" height="88" rx="10" fill="#F6F9EE" stroke="#A8C97E" stroke-width="1" />
<text x="180" y="200" font-size="16" fill="#27500A" text-anchor="middle">Preislisten · Dokumente</text>
<text x="180" y="226" font-size="16" fill="#27500A" text-anchor="middle">historische Angebote</text>
<text x="180" y="252" font-size="16" fill="#3B6D11" text-anchor="middle">URLs zum Crawlen</text>

<line x1="180" y1="270" x2="180" y2="292" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)" />
<text x="180" y="310" font-size="14" font-weight="600" fill="#888780" text-anchor="middle">VERARBEITUNG</text>
<rect x="40" y="320" width="280" height="112" rx="10" fill="#EAF3DE" stroke="#639922" stroke-width="1" />
<text x="180" y="344" font-size="16" fill="#27500A" text-anchor="middle">Manuelle Eingabe (versioniert,</text>
<text x="180" y="370" font-size="16" fill="#27500A" text-anchor="middle">rückrollbar)</text>
<text x="180" y="396" font-size="16" fill="#3B6D11" text-anchor="middle">AI-Lernen aus Dokumenten</text>
<text x="180" y="422" font-size="16" fill="#3B6D11" text-anchor="middle">Markt-Crawl, bei Bedarf</text>

<line x1="180" y1="438" x2="180" y2="460" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)" />
<text x="180" y="478" font-size="14" font-weight="600" fill="#888780" text-anchor="middle">AUSGABE</text>
<rect x="40" y="488" width="280" height="88" rx="10" fill="#F6F9EE" stroke="#A8C97E" stroke-width="1" />
<text x="180" y="512" font-size="16" fill="#27500A" text-anchor="middle">main_db · learn_db</text>
<text x="180" y="538" font-size="16" fill="#3B6D11" text-anchor="middle">market_db (erst bestätigen)</text>


<rect x="340" y="92" width="280" height="56" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1" />
<text x="480" y="118" font-size="22" font-weight="600" fill="#3C3489" text-anchor="middle">Modus 2 — Abfrage</text>
<text x="480" y="140" font-size="14" fill="#534AB7" text-anchor="middle">Einzelposten-Nachschlag</text>

<text x="480" y="166" font-size="14" font-weight="600" fill="#888780" text-anchor="middle">EINGABE</text>
<rect x="340" y="176" width="280" height="88" rx="10" fill="#F7F6FE" stroke="#B3ADEB" stroke-width="1" />
<text x="480" y="200" font-size="16" fill="#3C3489" text-anchor="middle">Ein Material / Produkt</text>
<text x="480" y="226" font-size="16" fill="#3C3489" text-anchor="middle">Name (+ Menge / Einheit)</text>
<text x="480" y="252" font-size="16" fill="#534AB7" text-anchor="middle">Spezifikationen / Notizen</text>

<line x1="480" y1="270" x2="480" y2="292" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)" />
<text x="480" y="310" font-size="14" font-weight="600" fill="#888780" text-anchor="middle">VERARBEITUNG</text>
<rect x="340" y="320" width="280" height="112" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1" />
<text x="480" y="344" font-size="16" fill="#3C3489" text-anchor="middle">Zuerst main_db-Kosten lesen</text>
<text x="480" y="370" font-size="16" fill="#3C3489" text-anchor="middle">(höchste Gewichtung)</text>
<text x="480" y="396" font-size="16" fill="#534AB7" text-anchor="middle">market_db überlagern</text>
<text x="480" y="422" font-size="16" fill="#534AB7" text-anchor="middle">schwebende Preisspanne</text>

<line x1="480" y1="438" x2="480" y2="460" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)" />
<text x="480" y="478" font-size="14" font-weight="600" fill="#888780" text-anchor="middle">AUSGABE</text>
<rect x="340" y="488" width="280" height="88" rx="10" fill="#F7F6FE" stroke="#B3ADEB" stroke-width="1" />
<text x="480" y="512" font-size="16" fill="#3C3489" text-anchor="middle">Standardkosten + Markt</text>
<text x="480" y="538" font-size="16" fill="#534AB7" text-anchor="middle">Referenz + Prozessnotizen</text>


<rect x="640" y="92" width="280" height="56" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="1" />
<text x="780" y="118" font-size="22" font-weight="600" fill="#633806" text-anchor="middle">Modus 3 — Angebot</text>
<text x="780" y="140" font-size="14" fill="#854F0B" text-anchor="middle">BOM-Batch-Befüllung · Smart-Angebot</text>

<text x="780" y="166" font-size="14" font-weight="600" fill="#888780" text-anchor="middle">EINGABE</text>
<rect x="640" y="176" width="280" height="88" rx="10" fill="#FDF6EA" stroke="#D6A96B" stroke-width="1" />
<text x="780" y="200" font-size="16" fill="#633806" text-anchor="middle">BOM / Materialliste</text>
<text x="780" y="226" font-size="16" fill="#633806" text-anchor="middle">Einschränkungen (Standard /</text>
<text x="780" y="252" font-size="16" fill="#854F0B" text-anchor="middle">Projekt)</text>

<line x1="780" y1="270" x2="780" y2="292" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)" />
<text x="780" y="310" font-size="14" font-weight="600" fill="#888780" text-anchor="middle">VERARBEITUNG</text>
<rect x="640" y="320" width="280" height="112" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="1" />
<text x="780" y="344" font-size="16" fill="#633806" text-anchor="middle">Kostenberechnung</text>
<text x="780" y="370" font-size="16" fill="#633806" text-anchor="middle">Dreistufige Preisbildung</text>
<text x="780" y="396" font-size="16" fill="#854F0B" text-anchor="middle">(niedrig / mittel / hoch)</text>
<text x="780" y="422" font-size="16" fill="#854F0B" text-anchor="middle">Vorlagenanpassung</text>

<line x1="780" y1="438" x2="780" y2="460" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)" />
<text x="780" y="478" font-size="14" font-weight="600" fill="#888780" text-anchor="middle">AUSGABE</text>
<rect x="640" y="488" width="280" height="88" rx="10" fill="#FDF6EA" stroke="#D6A96B" stroke-width="1" />
<text x="780" y="512" font-size="16" fill="#633806" text-anchor="middle">Angebot nach output/</text>
<text x="780" y="538" font-size="16" fill="#854F0B" text-anchor="middle">(Standard oder Benutzervorlage)</text>


<rect x="940" y="92" width="280" height="56" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1" />
<text x="1080" y="118" font-size="22" font-weight="600" fill="#04342C" text-anchor="middle">Modus 4 — Prüfung</text>
<text x="1080" y="140" font-size="14" fill="#0F6E56" text-anchor="middle">Benutzertabellen kreuzvalidieren</text>

<text x="1080" y="166" font-size="14" font-weight="600" fill="#888780" text-anchor="middle">EINGABE</text>
<rect x="940" y="176" width="280" height="88" rx="10" fill="#EFFAF6" stroke="#6EC6A6" stroke-width="1" />
<text x="1080" y="200" font-size="16" fill="#04342C" text-anchor="middle">Eigene Kosten /</text>
<text x="1080" y="226" font-size="16" fill="#04342C" text-anchor="middle">Angebotstabelle</text>
<text x="1080" y="252" font-size="16" fill="#0F6E56" text-anchor="middle">(mit Notizen)</text>

<line x1="1080" y1="270" x2="1080" y2="292" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)" />
<text x="1080" y="310" font-size="14" font-weight="600" fill="#888780" text-anchor="middle">VERARBEITUNG</text>
<rect x="940" y="320" width="280" height="112" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1" />
<text x="1080" y="344" font-size="16" fill="#04342C" text-anchor="middle">Kreuzvalidieren mit</text>
<text x="1080" y="370" font-size="16" fill="#04342C" text-anchor="middle">main_db + market_db</text>
<text x="1080" y="396" font-size="16" fill="#0F6E56" text-anchor="middle">Abweichende Preise markieren</text>
<text x="1080" y="422" font-size="16" fill="#0F6E56" text-anchor="middle">(zu hoch / zu niedrig)</text>

<line x1="1080" y1="438" x2="1080" y2="460" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)" />
<text x="1080" y="478" font-size="14" font-weight="600" fill="#888780" text-anchor="middle">AUSGABE</text>
<rect x="940" y="488" width="280" height="88" rx="10" fill="#EFFAF6" stroke="#6EC6A6" stroke-width="1" />
<text x="1080" y="512" font-size="16" fill="#04342C" text-anchor="middle">Anomalie-Flags +</text>
<text x="1080" y="538" font-size="16" fill="#0F6E56" text-anchor="middle">Anpassungsvorschläge</text>

<text x="640" y="616" font-size="14" fill="#888780" text-anchor="middle">Schreibt nie die offizielle Basis — Lern- &amp;amp; Marktdaten nur nach Bestätigung</text>
</svg>