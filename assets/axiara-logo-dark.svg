<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-labelledby="axiaraTitle axiaraDesc">
  <title id="axiaraTitle">Axiara</title>
  <desc id="axiaraDesc">An ascending market-price curve behind a diamond-shaped valuation core, surrounded by four agent nodes.</desc>
  <defs>
    <linearGradient id="ax-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="ax-line" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>

  <!-- Ascending market-price / valuation curve -->
  <polyline points="12,94 56,72 108,26"
            fill="none" stroke="url(#ax-line)" stroke-width="8"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Valuation core (diamond) -->
  <rect x="31" y="31" width="58" height="58" rx="15"
        fill="url(#ax-core)" transform="rotate(45 60 60)"/>

  <!-- Four agent nodes: archive / query / quote / review -->
  <g fill="#A5B4FC">
    <circle cx="60" cy="10" r="5"/>
    <circle cx="110" cy="60" r="5"/>
    <circle cx="60" cy="110" r="5"/>
    <circle cx="10" cy="60" r="5"/>
  </g>
</svg>
