<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="360" height="360" role="img" aria-labelledby="axiaraTitle axiaraDesc">
  <title id="axiaraTitle">Axiara — Agent Quotation Core</title>
  <desc id="axiaraDesc">Four agent nodes orbiting a valuation core along three layered data orbits, crossed by an ascending market-price curve.</desc>
  <defs>
    <linearGradient id="axiara-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="axiara-price" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
  </defs>

  <!-- Ascending market-price / valuation curve -->
  <polyline points="48,256 108,228 172,244 234,182 304,114"
            fill="none" stroke="url(#axiara-price)" stroke-width="7"
            stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

  <!-- Three layered data orbits: official baseline / learned reference / market prices -->
  <circle cx="180" cy="180" r="150" fill="none" stroke="#8B5CF6" stroke-width="3" stroke-dasharray="2 12" opacity="0.30"/>
  <circle cx="180" cy="180" r="118" fill="none" stroke="#6366F1" stroke-width="3" stroke-dasharray="2 12" opacity="0.45"/>
  <circle cx="180" cy="180" r="88" fill="none" stroke="#8B5CF6" stroke-width="2.5" stroke-dasharray="1 9" opacity="0.35"/>

  <!-- Orbital dust -->
  <circle cx="330" cy="180" r="4" fill="#8B5CF6" opacity="0.5"/>
  <circle cx="56" cy="112" r="3" fill="#14B8A6" opacity="0.55"/>

  <!-- Four agent nodes: archive / query / quote / review -->
  <g fill="none" stroke="#6366F1" stroke-width="4">
    <circle cx="96.6" cy="96.6" r="10.5"/>
    <circle cx="263.4" cy="96.6" r="10.5"/>
    <circle cx="263.4" cy="263.4" r="10.5"/>
    <circle cx="96.6" cy="263.4" r="10.5"/>
  </g>
  <g fill="#6366F1">
    <circle cx="96.6" cy="96.6" r="3.5"/>
    <circle cx="263.4" cy="96.6" r="3.5"/>
    <circle cx="263.4" cy="263.4" r="3.5"/>
    <circle cx="96.6" cy="263.4" r="3.5"/>
  </g>

  <!-- Valuation core -->
  <circle cx="180" cy="180" r="46" fill="url(#axiara-core)"/>
  <circle cx="180" cy="180" r="46" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2"/>
  <rect x="157" y="157" width="46" height="46" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round" transform="rotate(45 180 180)" opacity="0.95"/>
</svg>
