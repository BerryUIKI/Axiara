<ns0:path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
</ns0:marker>
</ns0:defs>
<ns0:rect x="40" y="20" width="600" height="66" rx="12" fill="#04342C" stroke="#5DCAA5" stroke-width="1" />
<ns0:text x="340" y="46" font-size="15" font-weight="600" fill="#E1F5EE" text-anchor="middle">Axiara AgentWorkspace</ns0:text>
<ns0:text x="340" y="66" font-size="12" fill="#9FE1CB" text-anchor="middle">LangGraph · 成本引擎 · 价格抓取 · 调度器 · 报价</ns0:text>
<ns0:line x1="340" y1="86" x2="340" y2="118" stroke="#9E9D98" stroke-width="1.5" marker-end="url(#arrow)" />
<ns0:line x1="340" y1="118" x2="135" y2="150" stroke="#9E9D98" stroke-width="1.5" />
<ns0:line x1="340" y1="118" x2="340" y2="150" stroke="#9E9D98" stroke-width="1.5" />
<ns0:line x1="340" y1="118" x2="545" y2="150" stroke="#9E9D98" stroke-width="1.5" />
<ns0:rect x="40" y="154" width="190" height="82" rx="10" fill="#173404" stroke="#97C459" stroke-width="1" />
<ns0:text x="135" y="180" font-size="14" font-weight="600" fill="#C0DD97" text-anchor="middle">main_db</ns0:text>
<ns0:text x="135" y="200" font-size="12" fill="#97C459" text-anchor="middle">官方基准</ns0:text>
<ns0:text x="135" y="218" font-size="12" fill="#97C459" text-anchor="middle">仅人工编辑</ns0:text>
<ns0:rect x="245" y="154" width="190" height="82" rx="10" fill="#26215C" stroke="#AFA9EC" stroke-width="1" />
<ns0:text x="340" y="180" font-size="14" font-weight="600" fill="#CECBF6" text-anchor="middle">learn_db</ns0:text>
<ns0:text x="340" y="200" font-size="12" fill="#AFA9EC" text-anchor="middle">学习参考</ns0:text>
<ns0:text x="340" y="218" font-size="12" fill="#AFA9EC" text-anchor="middle">AI 训练</ns0:text>
<ns0:rect x="450" y="154" width="190" height="82" rx="10" fill="#412402" stroke="#EF9F27" stroke-width="1" />
<ns0:text x="545" y="180" font-size="14" font-weight="600" fill="#FAC775" text-anchor="middle">market_db</ns0:text>
<ns0:text x="545" y="200" font-size="12" fill="#EF9F27" text-anchor="middle">市场行情</ns0:text>
<ns0:text x="545" y="218" font-size="12" fill="#EF9F27" text-anchor="middle">抓取 · 先确认</ns0:text>
<ns0:text x="340" y="268" font-size="11" fill="#9E9D98" text-anchor="middle">Agent 永远无法覆盖官方基准库 — 学习与行情数据只在确认后进入</ns0:text>
