<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="100%" role="img">
<ns0:title>Axiara architecture</ns0:title>
<ns0:desc>Axiara agent workspace on top of three isolated data layers: official baseline, learned reference, market prices</ns0:desc>
<ns0:defs>
