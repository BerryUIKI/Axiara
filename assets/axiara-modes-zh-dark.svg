<svg viewBox="0 0 1280 660" width="100%" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Axiara 四大模式</title>
<desc>四大模式：归档（模式一）、查询（模式二）、报价（模式三）、复核（模式四）—— 每个模式包含输入、处理、输出</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- Header -->
<rect x="40" y="20" width="1200" height="62" rx="12" fill="#04342C" stroke="#5DCAA5" stroke-width="1"/>
<text x="640" y="50" font-size="28" font-weight="600" fill="#E1F5EE" text-anchor="middle">四大模式 — Axiara 能做什么</text>
<text x="640" y="72" font-size="17" fill="#9FE1CB" text-anchor="middle">Agent 按任务自主选择模式；每个模式都是能力与权限边界</text>

<!-- ============ 模式一 — 归档 ============ -->
<rect x="40" y="104" width="280" height="62" rx="10" fill="#173404" stroke="#97C459" stroke-width="1"/>
<text x="180" y="132" font-size="24" font-weight="600" fill="#C0DD97" text-anchor="middle">模式一 — 归档</text>
<text x="180" y="156" font-size="15" fill="#97C459" text-anchor="middle">官方价目录入 · 学习 · 抓取</text>

<text x="180" y="186" font-size="16" font-weight="600" fill="#9E9D98" text-anchor="middle">输入</text>
<rect x="40" y="198" width="280" height="104" rx="10" fill="#0E2402" stroke="#618D3A" stroke-width="1"/>
<text x="180" y="226" font-size="22" fill="#C0DD97" text-anchor="middle">价目表 · 单据</text>
<text x="180" y="256" font-size="22" fill="#C0DD97" text-anchor="middle">历史报价</text>
<text x="180" y="286" font-size="22" fill="#97C459" text-anchor="middle">网页地址（抓取）</text>

<line x1="180" y1="306" x2="180" y2="330" stroke="#9E9D98" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="180" y="350" font-size="16" font-weight="600" fill="#9E9D98" text-anchor="middle">处理</text>
<rect x="40" y="362" width="280" height="130" rx="10" fill="#173404" stroke="#97C459" stroke-width="1"/>
<text x="180" y="390" font-size="22" fill="#C0DD97" text-anchor="middle">人工录入（带版本、</text>
<text x="180" y="420" font-size="22" fill="#C0DD97" text-anchor="middle">可回滚）</text>
<text x="180" y="450" font-size="22" fill="#97C459" text-anchor="middle">从单据 AI 学习</text>
<text x="180" y="480" font-size="22" fill="#97C459" text-anchor="middle">按需抓取行情</text>

<line x1="180" y1="496" x2="180" y2="520" stroke="#9E9D98" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="180" y="540" font-size="16" font-weight="600" fill="#9E9D98" text-anchor="middle">输出</text>
<rect x="40" y="552" width="280" height="76" rx="10" fill="#0E2402" stroke="#618D3A" stroke-width="1"/>
<text x="180" y="580" font-size="22" fill="#C0DD97" text-anchor="middle">main_db · learn_db</text>
<text x="180" y="610" font-size="22" fill="#97C459" text-anchor="middle">market_db（确认后写入）</text>

<!-- ============ 模式二 — 查询 ============ -->
<rect x="340" y="104" width="280" height="62" rx="10" fill="#26215C" stroke="#AFA9EC" stroke-width="1"/>
<text x="480" y="132" font-size="24" font-weight="600" fill="#CECBF6" text-anchor="middle">模式二 — 查询</text>
<text x="480" y="156" font-size="15" fill="#AFA9EC" text-anchor="middle">单品详情查询</text>

<text x="480" y="186" font-size="16" font-weight="600" fill="#9E9D98" text-anchor="middle">输入</text>
<rect x="340" y="198" width="280" height="104" rx="10" fill="#1C1848" stroke="#7A71C9" stroke-width="1"/>
<text x="480" y="226" font-size="22" fill="#CECBF6" text-anchor="middle">某个材料 / 产品名称</text>
<text x="480" y="256" font-size="22" fill="#CECBF6" text-anchor="middle">（+ 数量 / 单位）</text>
<text x="480" y="286" font-size="22" fill="#AFA9EC" text-anchor="middle">规格 / 备注匹配</text>

<line x1="480" y1="306" x2="480" y2="330" stroke="#9E9D98" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="480" y="350" font-size="16" font-weight="600" fill="#9E9D98" text-anchor="middle">处理</text>
<rect x="340" y="362" width="280" height="130" rx="10" fill="#26215C" stroke="#AFA9EC" stroke-width="1"/>
<text x="480" y="390" font-size="22" fill="#CECBF6" text-anchor="middle">先读 main_db 成本</text>
<text x="480" y="420" font-size="22" fill="#CECBF6" text-anchor="middle">（最高权重）</text>
<text x="480" y="450" font-size="22" fill="#AFA9EC" text-anchor="middle">叠加 market_db</text>
<text x="480" y="480" font-size="22" fill="#AFA9EC" text-anchor="middle">浮动价格区间</text>

<line x1="480" y1="496" x2="480" y2="520" stroke="#9E9D98" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="480" y="540" font-size="16" font-weight="600" fill="#9E9D98" text-anchor="middle">输出</text>
<rect x="340" y="552" width="280" height="76" rx="10" fill="#1C1848" stroke="#7A71C9" stroke-width="1"/>
<text x="480" y="580" font-size="22" fill="#CECBF6" text-anchor="middle">标准成本 + 市场参考</text>
<text x="480" y="610" font-size="22" fill="#AFA9EC" text-anchor="middle">+ 工艺备注</text>

<!-- ============ 模式三 — 报价 ============ -->
<rect x="640" y="104" width="280" height="62" rx="10" fill="#412402" stroke="#EF9F27" stroke-width="1"/>
<text x="780" y="132" font-size="24" font-weight="600" fill="#FAC775" text-anchor="middle">模式三 — 报价</text>
<text x="780" y="156" font-size="15" fill="#EF9F27" text-anchor="middle">BOM 批量回填 · 智能报价</text>

<text x="780" y="186" font-size="16" font-weight="600" fill="#9E9D98" text-anchor="middle">输入</text>
<rect x="640" y="198" width="280" height="104" rx="10" fill="#2F1B02" stroke="#B97B2A" stroke-width="1"/>
<text x="780" y="226" font-size="22" fill="#FAC775" text-anchor="middle">BOM / 物料清单</text>
<text x="780" y="256" font-size="22" fill="#FAC775" text-anchor="middle">约束（默认 /</text>
<text x="780" y="286" font-size="22" fill="#EF9F27" text-anchor="middle">项目）</text>

<line x1="780" y1="306" x2="780" y2="330" stroke="#9E9D98" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="780" y="350" font-size="16" font-weight="600" fill="#9E9D98" text-anchor="middle">处理</text>
<rect x="640" y="362" width="280" height="130" rx="10" fill="#412402" stroke="#EF9F27" stroke-width="1"/>
<text x="780" y="390" font-size="22" fill="#FAC775" text-anchor="middle">成本核算</text>
<text x="780" y="420" font-size="22" fill="#FAC775" text-anchor="middle">三档定价</text>
<text x="780" y="450" font-size="22" fill="#EF9F27" text-anchor="middle">（低 / 中 / 高）</text>
<text x="780" y="480" font-size="22" fill="#EF9F27" text-anchor="middle">模板自适应</text>

<line x1="780" y1="496" x2="780" y2="520" stroke="#9E9D98" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="780" y="540" font-size="16" font-weight="600" fill="#9E9D98" text-anchor="middle">输出</text>
<rect x="640" y="552" width="280" height="76" rx="10" fill="#2F1B02" stroke="#B97B2A" stroke-width="1"/>
<text x="780" y="580" font-size="22" fill="#FAC775" text-anchor="middle">报价单到 output/</text>
<text x="780" y="610" font-size="22" fill="#EF9F27" text-anchor="middle">（默认或用户模板）</text>

<!-- ============ 模式四 — 复核 ============ -->
<rect x="940" y="104" width="280" height="62" rx="10" fill="#04342C" stroke="#5DCAA5" stroke-width="1"/>
<text x="1080" y="132" font-size="24" font-weight="600" fill="#E1F5EE" text-anchor="middle">模式四 — 复核</text>
<text x="1080" y="156" font-size="15" fill="#9FE1CB" text-anchor="middle">交叉校验用户表格</text>

<text x="1080" y="186" font-size="16" font-weight="600" fill="#9E9D98" text-anchor="middle">输入</text>
<rect x="940" y="198" width="280" height="104" rx="10" fill="#04241C" stroke="#3E9C7D" stroke-width="1"/>
<text x="1080" y="226" font-size="22" fill="#E1F5EE" text-anchor="middle">用户自己的成本 /</text>
<text x="1080" y="256" font-size="22" fill="#E1F5EE" text-anchor="middle">报价表格</text>
<text x="1080" y="286" font-size="22" fill="#9FE1CB" text-anchor="middle">（含备注）</text>

<line x1="1080" y1="306" x2="1080" y2="330" stroke="#9E9D98" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="1080" y="350" font-size="16" font-weight="600" fill="#9E9D98" text-anchor="middle">处理</text>
<rect x="940" y="362" width="280" height="130" rx="10" fill="#04342C" stroke="#5DCAA5" stroke-width="1"/>
<text x="1080" y="390" font-size="22" fill="#E1F5EE" text-anchor="middle">对照 main_db +</text>
<text x="1080" y="420" font-size="22" fill="#E1F5EE" text-anchor="middle">market_db 交叉校验</text>
<text x="1080" y="450" font-size="22" fill="#9FE1CB" text-anchor="middle">标记异常价格</text>
<text x="1080" y="480" font-size="22" fill="#9FE1CB" text-anchor="middle">（偏高 / 偏低）</text>

<line x1="1080" y1="496" x2="1080" y2="520" stroke="#9E9D98" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="1080" y="540" font-size="16" font-weight="600" fill="#9E9D98" text-anchor="middle">输出</text>
<rect x="940" y="552" width="280" height="76" rx="10" fill="#04241C" stroke="#3E9C7D" stroke-width="1"/>
<text x="1080" y="580" font-size="22" fill="#E1F5EE" text-anchor="middle">异常标记 +</text>
<text x="1080" y="610" font-size="22" fill="#9FE1CB" text-anchor="middle">调整建议</text>

<text x="640" y="648" font-size="16" fill="#9E9D98" text-anchor="middle">永远不写官方基准库 — 学习与行情数据只在确认后进入</text>
</svg>
