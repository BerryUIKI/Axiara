<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 660" width="100%" role="img">
<title>Axiara four modes</title>
<desc>Four modes: Archive (Mode 1), Query (Mode 2), Quote (Mode 3), Review (Mode 4) — each with input, process and output</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
</marker>
</defs>


<rect x="40" y="20" width="1200" height="56" rx="12" fill="#04342C" stroke="#5DCAA5" stroke-width="1" />
<text x="640" y="48" font-size="28" font-weight="600" fill="#E1F5EE" text-anchor="middle">Четыре режима — что умеет Axiara</text>
<text x="640" y="68" font-size="14" fill="#9FE1CB" text-anchor="middle">Агент выбирает режим под задачу; каждый режим — это граница возможностей и прав</text>


<rect x="40" y="92" width="280" height="56" rx="10" fill="#173404" stroke="#97C459" stroke-width="1" />
<text x="180" y="118" font-size="22" font-weight="600" fill="#C0DD97" text-anchor="middle">Режим 1 — Архив</text>
<text x="180" y="140" font-size="14" fill="#97C459" text-anchor="middle">официальные цены · обучение · сбор</text>

<text x="180" y="166" font-size="14" font-weight="600" fill="#9E9D98" text-anchor="middle">ВХОД</text>
<rect x="40" y="176" width="280" height="88" rx="10" fill="#0E2402" stroke="#618D3A" stroke-width="1" />
<text x="180" y="200" font-size="16" fill="#C0DD97" text-anchor="middle">Прайс-листы · документы</text>
<text x="180" y="226" font-size="16" fill="#C0DD97" text-anchor="middle">исторические расценки</text>
<text x="180" y="252" font-size="16" fill="#97C459" text-anchor="middle">URL для сбора</text>

<line x1="180" y1="270" x2="180" y2="292" stroke="#9E9D98" stroke-width="1.5" marker-end="url(#arrow)" />
<text x="180" y="310" font-size="14" font-weight="600" fill="#9E9D98" text-anchor="middle">ОБРАБОТКА</text>
<rect x="40" y="320" width="280" height="112" rx="10" fill="#173404" stroke="#97C459" stroke-width="1" />
<text x="180" y="344" font-size="16" fill="#C0DD97" text-anchor="middle">Ручной ввод (с версиями,</text>
<text x="180" y="370" font-size="16" fill="#C0DD97" text-anchor="middle">откат возможен)</text>
<text x="180" y="396" font-size="16" fill="#97C459" text-anchor="middle">ИИ-обучение по документам</text>
<text x="180" y="422" font-size="16" fill="#97C459" text-anchor="middle">Сбор рынка по требованию</text>

<line x1="180" y1="438" x2="180" y2="460" stroke="#9E9D98" stroke-width="1.5" marker-end="url(#arrow)" />
<text x="180" y="478" font-size="14" font-weight="600" fill="#9E9D98" text-anchor="middle">ВЫХОД</text>
<rect x="40" y="488" width="280" height="88" rx="10" fill="#0E2402" stroke="#618D3A" stroke-width="1" />
<text x="180" y="512" font-size="16" fill="#C0DD97" text-anchor="middle">main_db · learn_db</text>
<text x="180" y="538" font-size="16" fill="#97C459" text-anchor="middle">market_db (сначала подтвердить)</text>


<rect x="340" y="92" width="280" height="56" rx="10" fill="#26215C" stroke="#AFA9EC" stroke-width="1" />
<text x="480" y="118" font-size="22" font-weight="600" fill="#CECBF6" text-anchor="middle">Режим 2 — Запрос</text>
<text x="480" y="140" font-size="14" fill="#AFA9EC" text-anchor="middle">детальный запрос по позиции</text>

<text x="480" y="166" font-size="14" font-weight="600" fill="#9E9D98" text-anchor="middle">ВХОД</text>
<rect x="340" y="176" width="280" height="88" rx="10" fill="#1C1848" stroke="#7A71C9" stroke-width="1" />
<text x="480" y="200" font-size="16" fill="#CECBF6" text-anchor="middle">Материал / продукт</text>
<text x="480" y="226" font-size="16" fill="#CECBF6" text-anchor="middle">название (+ кол-во / ед.)</text>
<text x="480" y="252" font-size="16" fill="#AFA9EC" text-anchor="middle">характеристики / примечания</text>

<line x1="480" y1="270" x2="480" y2="292" stroke="#9E9D98" stroke-width="1.5" marker-end="url(#arrow)" />
<text x="480" y="310" font-size="14" font-weight="600" fill="#9E9D98" text-anchor="middle">ОБРАБОТКА</text>
<rect x="340" y="320" width="280" height="112" rx="10" fill="#26215C" stroke="#AFA9EC" stroke-width="1" />
<text x="480" y="344" font-size="16" fill="#CECBF6" text-anchor="middle">Сначала стоимость из main_db</text>
<text x="480" y="370" font-size="16" fill="#CECBF6" text-anchor="middle">(наивысший приоритет)</text>
<text x="480" y="396" font-size="16" fill="#AFA9EC" text-anchor="middle">Наложить market_db</text>
<text x="480" y="422" font-size="16" fill="#AFA9EC" text-anchor="middle">плавающий диапазон цен</text>

<line x1="480" y1="438" x2="480" y2="460" stroke="#9E9D98" stroke-width="1.5" marker-end="url(#arrow)" />
<text x="480" y="478" font-size="14" font-weight="600" fill="#9E9D98" text-anchor="middle">ВЫХОД</text>
<rect x="340" y="488" width="280" height="88" rx="10" fill="#1C1848" stroke="#7A71C9" stroke-width="1" />
<text x="480" y="512" font-size="16" fill="#CECBF6" text-anchor="middle">Стандарт + рынок</text>
<text x="480" y="538" font-size="16" fill="#AFA9EC" text-anchor="middle">справка + технологические заметки</text>


<rect x="640" y="92" width="280" height="56" rx="10" fill="#412402" stroke="#EF9F27" stroke-width="1" />
<text x="780" y="118" font-size="22" font-weight="600" fill="#FAC775" text-anchor="middle">Режим 3 — Расценка</text>
<text x="780" y="140" font-size="14" fill="#EF9F27" text-anchor="middle">пакетное заполнение BOM · умная расценка</text>

<text x="780" y="166" font-size="14" font-weight="600" fill="#9E9D98" text-anchor="middle">ВХОД</text>
<rect x="640" y="176" width="280" height="88" rx="10" fill="#2F1B02" stroke="#B97B2A" stroke-width="1" />
<text x="780" y="200" font-size="16" fill="#FAC775" text-anchor="middle">BOM / список материалов</text>
<text x="780" y="226" font-size="16" fill="#FAC775" text-anchor="middle">ограничения (по умолчанию /</text>
<text x="780" y="252" font-size="16" fill="#EF9F27" text-anchor="middle">проект)</text>

<line x1="780" y1="270" x2="780" y2="292" stroke="#9E9D98" stroke-width="1.5" marker-end="url(#arrow)" />
<text x="780" y="310" font-size="14" font-weight="600" fill="#9E9D98" text-anchor="middle">ОБРАБОТКА</text>
<rect x="640" y="320" width="280" height="112" rx="10" fill="#412402" stroke="#EF9F27" stroke-width="1" />
<text x="780" y="344" font-size="16" fill="#FAC775" text-anchor="middle">Расчёт стоимости</text>
<text x="780" y="370" font-size="16" fill="#FAC775" text-anchor="middle">Трёхуровневое ценообразование</text>
<text x="780" y="396" font-size="16" fill="#EF9F27" text-anchor="middle">(низкий / средний / высокий)</text>
<text x="780" y="422" font-size="16" fill="#EF9F27" text-anchor="middle">Адаптация шаблона</text>

<line x1="780" y1="438" x2="780" y2="460" stroke="#9E9D98" stroke-width="1.5" marker-end="url(#arrow)" />
<text x="780" y="478" font-size="14" font-weight="600" fill="#9E9D98" text-anchor="middle">ВЫХОД</text>
<rect x="640" y="488" width="280" height="88" rx="10" fill="#2F1B02" stroke="#B97B2A" stroke-width="1" />
<text x="780" y="512" font-size="16" fill="#FAC775" text-anchor="middle">Расценка в output/</text>
<text x="780" y="538" font-size="16" fill="#EF9F27" text-anchor="middle">(шаблон по умолчанию или пользователя)</text>


<rect x="940" y="92" width="280" height="56" rx="10" fill="#04342C" stroke="#5DCAA5" stroke-width="1" />
<text x="1080" y="118" font-size="22" font-weight="600" fill="#E1F5EE" text-anchor="middle">Режим 4 — Проверка</text>
<text x="1080" y="140" font-size="14" fill="#9FE1CB" text-anchor="middle">перекрёстная проверка таблиц пользователя</text>

<text x="1080" y="166" font-size="14" font-weight="600" fill="#9E9D98" text-anchor="middle">ВХОД</text>
<rect x="940" y="176" width="280" height="88" rx="10" fill="#04241C" stroke="#3E9C7D" stroke-width="1" />
<text x="1080" y="200" font-size="16" fill="#E1F5EE" text-anchor="middle">Своя стоимость /</text>
<text x="1080" y="226" font-size="16" fill="#E1F5EE" text-anchor="middle">таблица расценок</text>
<text x="1080" y="252" font-size="16" fill="#9FE1CB" text-anchor="middle">(с примечаниями)</text>

<line x1="1080" y1="270" x2="1080" y2="292" stroke="#9E9D98" stroke-width="1.5" marker-end="url(#arrow)" />
<text x="1080" y="310" font-size="14" font-weight="600" fill="#9E9D98" text-anchor="middle">ОБРАБОТКА</text>
<rect x="940" y="320" width="280" height="112" rx="10" fill="#04342C" stroke="#5DCAA5" stroke-width="1" />
<text x="1080" y="344" font-size="16" fill="#E1F5EE" text-anchor="middle">Сверка с</text>
<text x="1080" y="370" font-size="16" fill="#E1F5EE" text-anchor="middle">main_db + market_db</text>
<text x="1080" y="396" font-size="16" fill="#9FE1CB" text-anchor="middle">Отмечать аномальные цены</text>
<text x="1080" y="422" font-size="16" fill="#9FE1CB" text-anchor="middle">(слишком высокие / низкие)</text>

<line x1="1080" y1="438" x2="1080" y2="460" stroke="#9E9D98" stroke-width="1.5" marker-end="url(#arrow)" />
<text x="1080" y="478" font-size="14" font-weight="600" fill="#9E9D98" text-anchor="middle">ВЫХОД</text>
<rect x="940" y="488" width="280" height="88" rx="10" fill="#04241C" stroke="#3E9C7D" stroke-width="1" />
<text x="1080" y="512" font-size="16" fill="#E1F5EE" text-anchor="middle">Флаги аномалий +</text>
<text x="1080" y="538" font-size="16" fill="#9FE1CB" text-anchor="middle">предложения по корректировке</text>

<text x="640" y="616" font-size="14" fill="#9E9D98" text-anchor="middle">Никогда не перезаписывает официальную базу — обученные и рыночные данные входят только после подтверждения</text>
</svg>