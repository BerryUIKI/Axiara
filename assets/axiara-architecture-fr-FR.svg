<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="100%" role="img">
<title>Axiara architecture</title>
<desc>Axiara agent workspace on top of three isolated data layers: official baseline, learned reference, market prices</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
</marker>
</defs>
<rect x="40" y="20" width="600" height="66" rx="12" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1" />
<text x="340" y="46" font-size="15" font-weight="600" fill="#04342C" text-anchor="middle">Axiara AgentWorkspace</text>
<text x="340" y="66" font-size="12" fill="#0F6E56" text-anchor="middle">LangGraph · moteur de coût · collecte de prix · planificateur · devis</text>
<line x1="340" y1="86" x2="340" y2="118" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)" />
<line x1="340" y1="118" x2="135" y2="150" stroke="#888780" stroke-width="1.5" />
<line x1="340" y1="118" x2="340" y2="150" stroke="#888780" stroke-width="1.5" />
<line x1="340" y1="118" x2="545" y2="150" stroke="#888780" stroke-width="1.5" />
<rect x="40" y="154" width="190" height="82" rx="10" fill="#EAF3DE" stroke="#639922" stroke-width="1" />
<text x="135" y="180" font-size="14" font-weight="600" fill="#27500A" text-anchor="middle">main_db</text>
<text x="135" y="200" font-size="12" fill="#3B6D11" text-anchor="middle">Base officielle</text>
<text x="135" y="218" font-size="12" fill="#3B6D11" text-anchor="middle">édition manuelle uniquement</text>
<rect x="245" y="154" width="190" height="82" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1" />
<text x="340" y="180" font-size="14" font-weight="600" fill="#3C3489" text-anchor="middle">learn_db</text>
<text x="340" y="200" font-size="12" fill="#534AB7" text-anchor="middle">Référence apprise</text>
<text x="340" y="218" font-size="12" fill="#534AB7" text-anchor="middle">entraînement IA</text>
<rect x="450" y="154" width="190" height="82" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="1" />
<text x="545" y="180" font-size="14" font-weight="600" fill="#633806" text-anchor="middle">market_db</text>
<text x="545" y="200" font-size="12" fill="#854F0B" text-anchor="middle">Prix du marché</text>
<text x="545" y="218" font-size="12" fill="#854F0B" text-anchor="middle">collecté · confirmer d'abord</text>
<text x="340" y="268" font-size="11" fill="#888780" text-anchor="middle">Les agents ne peuvent jamais écraser la base officielle — les données apprises et de marché n'entrent qu'après confirmation</text>
</svg>