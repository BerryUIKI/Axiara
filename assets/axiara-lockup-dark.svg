<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 120" width="280" height="120" role="img" aria-labelledby="axiaraLockupTitle axiaraLockupDesc">
  <title id="axiaraLockupTitle">Axiara</title>
  <desc id="axiaraLockupDesc">Axiara logo mark with the project name.</desc>
  <defs>
    <linearGradient id="axl-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="axl-line" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>

  <!-- Logo mark -->
  <g transform="translate(12,24) scale(0.6)">
    <polyline points="12,94 56,72 108,26"
              fill="none" stroke="url(#axl-line)" stroke-width="8"
              stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="31" y="31" width="58" height="58" rx="15"
          fill="url(#axl-core)" transform="rotate(45 60 60)"/>
    <g fill="#A5B4FC">
      <circle cx="60" cy="10" r="5"/>
      <circle cx="110" cy="60" r="5"/>
      <circle cx="60" cy="110" r="5"/>
      <circle cx="10" cy="60" r="5"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="100" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="42" font-weight="700" letter-spacing="0.5" fill="#F3F4F6">Axiara</text>
</svg>
