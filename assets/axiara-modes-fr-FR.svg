<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 660" width="100%" role="img">
<title>Axiara four modes</title>
<desc>Four modes: Archive (Mode 1), Query (Mode 2), Quote (Mode 3), Review (Mode 4) — each with input, process and output</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
</marker>
</defs>


<rect x="40" y="20" width="1200" height="56" rx="12" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1" />
<text x="640" y="48" font-size="28" font-weight="600" fill="#04342C" text-anchor="middle">Quatre modes — ce que fait Axiara</text>
<text x="640" y="68" font-size="14" fill="#0F6E56" text-anchor="middle">Les agents choisissent un mode par tâche ; chaque mode est une frontière de capacités et permissions</text>


<rect x="40" y="92" width="280" height="56" rx="10" fill="#EAF3DE" stroke="#639922" stroke-width="1" />
<text x="180" y="118" font-size="22" font-weight="600" fill="#27500A" text-anchor="middle">Mode 1 — Archivage</text>
<text x="180" y="140" font-size="14" fill="#3B6D11" text-anchor="middle">tarifs officiels · apprentissage · collecte</text>

<text x="180" y="166" font-size="14" font-weight="600" fill="#888780" text-anchor="middle">ENTRÉE</text>
<rect x="40" y="176" width="280" height="88" rx="10" fill="#F6F9EE" stroke="#A8C97E" stroke-width="1" />
<text x="180" y="200" font-size="16" fill="#27500A" text-anchor="middle">Listes de prix · documents</text>
<text x="180" y="226" font-size="16" fill="#27500A" text-anchor="middle">devis historiques</text>
<text x="180" y="252" font-size="16" fill="#3B6D11" text-anchor="middle">URLs à collecter</text>

<line x1="180" y1="270" x2="180" y2="292" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)" />
<text x="180" y="310" font-size="14" font-weight="600" fill="#888780" text-anchor="middle">TRAITEMENT</text>
<rect x="40" y="320" width="280" height="112" rx="10" fill="#EAF3DE" stroke="#639922" stroke-width="1" />
<text x="180" y="344" font-size="16" fill="#27500A" text-anchor="middle">Saisie manuelle (versionnée,</text>
<text x="180" y="370" font-size="16" fill="#27500A" text-anchor="middle">annulable)</text>
<text x="180" y="396" font-size="16" fill="#3B6D11" text-anchor="middle">Apprentissage IA depuis documents</text>
<text x="180" y="422" font-size="16" fill="#3B6D11" text-anchor="middle">Collecte de marché, à la demande</text>

<line x1="180" y1="438" x2="180" y2="460" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)" />
<text x="180" y="478" font-size="14" font-weight="600" fill="#888780" text-anchor="middle">SORTIE</text>
<rect x="40" y="488" width="280" height="88" rx="10" fill="#F6F9EE" stroke="#A8C97E" stroke-width="1" />
<text x="180" y="512" font-size="16" fill="#27500A" text-anchor="middle">main_db · learn_db</text>
<text x="180" y="538" font-size="16" fill="#3B6D11" text-anchor="middle">market_db (confirmer d'abord)</text>


<rect x="340" y="92" width="280" height="56" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1" />
<text x="480" y="118" font-size="22" font-weight="600" fill="#3C3489" text-anchor="middle">Mode 2 — Consultation</text>
<text x="480" y="140" font-size="14" fill="#534AB7" text-anchor="middle">recherche détaillée d'un article</text>

<text x="480" y="166" font-size="14" font-weight="600" fill="#888780" text-anchor="middle">ENTRÉE</text>
<rect x="340" y="176" width="280" height="88" rx="10" fill="#F7F6FE" stroke="#B3ADEB" stroke-width="1" />
<text x="480" y="200" font-size="16" fill="#3C3489" text-anchor="middle">Un matériau / produit</text>
<text x="480" y="226" font-size="16" fill="#3C3489" text-anchor="middle">nom (+ quantité / unité)</text>
<text x="480" y="252" font-size="16" fill="#534AB7" text-anchor="middle">spécifications / notes</text>

<line x1="480" y1="270" x2="480" y2="292" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)" />
<text x="480" y="310" font-size="14" font-weight="600" fill="#888780" text-anchor="middle">TRAITEMENT</text>
<rect x="340" y="320" width="280" height="112" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1" />
<text x="480" y="344" font-size="16" fill="#3C3489" text-anchor="middle">Lire le coût main_db d'abord</text>
<text x="480" y="370" font-size="16" fill="#3C3489" text-anchor="middle">(poids le plus élevé)</text>
<text x="480" y="396" font-size="16" fill="#534AB7" text-anchor="middle">Superposer market_db</text>
<text x="480" y="422" font-size="16" fill="#534AB7" text-anchor="middle">fourchette de prix flottante</text>

<line x1="480" y1="438" x2="480" y2="460" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)" />
<text x="480" y="478" font-size="14" font-weight="600" fill="#888780" text-anchor="middle">SORTIE</text>
<rect x="340" y="488" width="280" height="88" rx="10" fill="#F7F6FE" stroke="#B3ADEB" stroke-width="1" />
<text x="480" y="512" font-size="16" fill="#3C3489" text-anchor="middle">Coût standard + marché</text>
<text x="480" y="538" font-size="16" fill="#534AB7" text-anchor="middle">référence + notes de processus</text>


<rect x="640" y="92" width="280" height="56" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="1" />
<text x="780" y="118" font-size="22" font-weight="600" fill="#633806" text-anchor="middle">Mode 3 — Devis</text>
<text x="780" y="140" font-size="14" fill="#854F0B" text-anchor="middle">remplissage BOM par lots · devis intelligent</text>

<text x="780" y="166" font-size="14" font-weight="600" fill="#888780" text-anchor="middle">ENTRÉE</text>
<rect x="640" y="176" width="280" height="88" rx="10" fill="#FDF6EA" stroke="#D6A96B" stroke-width="1" />
<text x="780" y="200" font-size="16" fill="#633806" text-anchor="middle">BOM / liste de matériaux</text>
<text x="780" y="226" font-size="16" fill="#633806" text-anchor="middle">contraintes (défaut /</text>
<text x="780" y="252" font-size="16" fill="#854F0B" text-anchor="middle">projet)</text>

<line x1="780" y1="270" x2="780" y2="292" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)" />
<text x="780" y="310" font-size="14" font-weight="600" fill="#888780" text-anchor="middle">TRAITEMENT</text>
<rect x="640" y="320" width="280" height="112" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="1" />
<text x="780" y="344" font-size="16" fill="#633806" text-anchor="middle">Calcul du coût</text>
<text x="780" y="370" font-size="16" fill="#633806" text-anchor="middle">Tarification à trois niveaux</text>
<text x="780" y="396" font-size="16" fill="#854F0B" text-anchor="middle">(bas / moyen / haut)</text>
<text x="780" y="422" font-size="16" fill="#854F0B" text-anchor="middle">Adaptation du modèle</text>

<line x1="780" y1="438" x2="780" y2="460" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)" />
<text x="780" y="478" font-size="14" font-weight="600" fill="#888780" text-anchor="middle">SORTIE</text>
<rect x="640" y="488" width="280" height="88" rx="10" fill="#FDF6EA" stroke="#D6A96B" stroke-width="1" />
<text x="780" y="512" font-size="16" fill="#633806" text-anchor="middle">Devis vers output/</text>
<text x="780" y="538" font-size="16" fill="#854F0B" text-anchor="middle">(modèle par défaut ou utilisateur)</text>


<rect x="940" y="92" width="280" height="56" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1" />
<text x="1080" y="118" font-size="22" font-weight="600" fill="#04342C" text-anchor="middle">Mode 4 — Vérification</text>
<text x="1080" y="140" font-size="14" fill="#0F6E56" text-anchor="middle">validation croisée des tableaux utilisateur</text>

<text x="1080" y="166" font-size="14" font-weight="600" fill="#888780" text-anchor="middle">ENTRÉE</text>
<rect x="940" y="176" width="280" height="88" rx="10" fill="#EFFAF6" stroke="#6EC6A6" stroke-width="1" />
<text x="1080" y="200" font-size="16" fill="#04342C" text-anchor="middle">Coût propre /</text>
<text x="1080" y="226" font-size="16" fill="#04342C" text-anchor="middle">tableau de devis</text>
<text x="1080" y="252" font-size="16" fill="#0F6E56" text-anchor="middle">(avec notes)</text>

<line x1="1080" y1="270" x2="1080" y2="292" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)" />
<text x="1080" y="310" font-size="14" font-weight="600" fill="#888780" text-anchor="middle">TRAITEMENT</text>
<rect x="940" y="320" width="280" height="112" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1" />
<text x="1080" y="344" font-size="16" fill="#04342C" text-anchor="middle">Validation croisée contre</text>
<text x="1080" y="370" font-size="16" fill="#04342C" text-anchor="middle">main_db + market_db</text>
<text x="1080" y="396" font-size="16" fill="#0F6E56" text-anchor="middle">Signaler les prix anormaux</text>
<text x="1080" y="422" font-size="16" fill="#0F6E56" text-anchor="middle">(trop élevé / trop bas)</text>

<line x1="1080" y1="438" x2="1080" y2="460" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)" />
<text x="1080" y="478" font-size="14" font-weight="600" fill="#888780" text-anchor="middle">SORTIE</text>
<rect x="940" y="488" width="280" height="88" rx="10" fill="#EFFAF6" stroke="#6EC6A6" stroke-width="1" />
<text x="1080" y="512" font-size="16" fill="#04342C" text-anchor="middle">Drapeaux d'anomalie +</text>
<text x="1080" y="538" font-size="16" fill="#0F6E56" text-anchor="middle">suggestions d'ajustement</text>

<text x="640" y="616" font-size="14" fill="#888780" text-anchor="middle">N'écrit jamais la base officielle — les données apprises et de marché n'entrent qu'après confirmation</text>
</svg>