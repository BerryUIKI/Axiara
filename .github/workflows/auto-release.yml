name: auto-release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Bump version
        id: ver
        run: |
          latest=$(git tag --list 'v*' --sort=-v:refname | head -1 || true)
          if [ -z "$latest" ]; then
            echo "version=v0.1.0"
          else
            base=$(echo "$latest" | sed -E 's/^(v[0-9]+\.[0-9]+\.)[0-9]+$/\1/')
            patch=$(echo "$latest" | sed -E 's/^v[0-9]+\.[0-9]+\.([0-9]+)$/\1/')
            echo "version=${base}$((patch + 1))"
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.ver.outputs.version }}" \
            --title "Axiara v${{ steps.ver.outputs.version }}" \
            --notes "Automated release from main (${{ github.sha }})

          GitHub automatically attaches source archives (zip / tar.gz) to this release."
