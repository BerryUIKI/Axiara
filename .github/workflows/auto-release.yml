name: auto-release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Bump version
        id: ver
        run: |
          latest=$(git tag --list 'v*' --sort=-v:refname | head -1 || true)
          if [ -z "$latest" ]; then
            echo "version=0.1.0" >> "$GITHUB_OUTPUT"
          else
            base=$(echo "$latest" | sed -E 's/^v([0-9]+\.[0-9]+\.)[0-9]+$/\1/')
            patch=$(echo "$latest" | sed -E 's/^v[0-9]+\.[0-9]+\.([0-9]+)$/\1/')
            echo "version=${base}$((patch + 1))" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release notes come from the corresponding CHANGELOG version entry
          # (doc-sync discipline: CHANGELOG [vX.Y.Z] is the main release record).
          NOTES=$(mktemp)
          awk -v ver="${{ steps.ver.outputs.version }}" '
            /^## \[/ { if (p) exit; if (index($0, "[" ver "]") > 0) p=1; next }
            p { print }
          ' CHANGELOG.md > "$NOTES" || true
          if [ ! -s "$NOTES" ]; then
            printf 'Automated release from main (%s)\n\nGitHub automatically attaches source archives (zip / tar.gz) to this release.' "${{ github.sha }}" > "$NOTES"
          fi
          gh release create "v${{ steps.ver.outputs.version }}" \
            --title "Axiara v${{ steps.ver.outputs.version }}" \
            --notes-file "$NOTES"
