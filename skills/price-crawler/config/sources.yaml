# Source Enablement Rules
enablement_rules:
  - Sources marked `legal: public_market_data` can be enabled after robots.txt check
  - Sources marked `legal: needs_review` require explicit user sign-off before enabling
  - All sources must be disabled by default until compliance verification
  - Per-source rate limits and crawl delays must be respected