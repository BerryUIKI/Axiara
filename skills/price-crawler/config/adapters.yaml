# Axiara Price Crawler - Site Adapter Selectors
# Per-source CSS/XPath selectors and parser configurations
# Version: v0.1
# See: docs/crawler-spec.md §5

# Template adapter structure (to be filled by coding agent)
# Format: CSS selectors or XPath for each source

# Domestic Sources (CN)

smm:
  # Shanghai Metals Market - www.smm.cn
  selectors:
    type: css  # css or xpath
    row: ""    # e.g., "table.prices tbody tr" - fill during implementation
    name: ""   # e.g., "td:nth-child(1)"
    spec: ""   # e.g., "td:nth-child(2)"
    unit_price: ""  # e.g., "td:nth-child(4)"
    unit: ""   # e.g., "td:nth-child(3)"
    effective_date: ""  # e.g., "td:nth-child(5)"
    currency: CNY
  parser: null  # null for selector-based, or named parser
  post_process:
    currency: CNY
    confidence: high
    notes: "Selectors to be filled during adapter implementation (C2)"

mofcom-cif:
  # MOFCOM CIF - cif.mofcom.gov.cn
  selectors:
    type: css
    row: ""
    name: ""
    spec: ""
    unit_price: ""
    unit: ""
    effective_date: ""
    currency: CNY
  parser: null
  post_process:
    currency: CNY
    confidence: high
    notes: "Official government source - high confidence; selectors TBD by coding agent"

# Global Sources

indexmundi:
  # IndexMundi - www.indexmundi.com
  selectors:
    type: css
    row: ""  # e.g., "table.table tbody tr"
    name: ""  # e.g., "td:nth-child(1)"
    unit_price: ""  # e.g., "td:nth-child(2)"
    unit: ""  # e.g., "td:nth-child(3)"
