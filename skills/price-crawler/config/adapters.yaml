tradingeconomics:
  # Trading Economics - tradingeconomics.com
  selectors:
    type: css
    row: ""
    name: ""
    unit_price: ""
    unit: ""
  parser: null
  post_process:
    confidence: medium
    notes: "May require JavaScript rendering or API access"

# Named Parsers for Exotic Layouts

named_parsers:
  table-json-api:
    description: "Parse JSON embedded in page or fetched from API endpoint"
    type: json
    usage: "Use when page loads data via AJAX/JSON API"
    implementation: "To be defined by coding agent"

  custom-html:
    description: "Complex HTML requiring custom extraction logic"
    type: custom
    usage: "Use when selectors insufficient (nested tables, multi-row entries)"
    implementation: "To be defined by coding agent"

  pdf-table:
    description: "Extract tabular data from PDF documents"
    type: pdf
    usage: "Use when source publishes PDF price lists"
    implementation: "Requires pdfplumber or similar library"

# Adapter Development Guidelines
#
# 1. Selector Priority:
#    - Prefer CSS selectors over XPath (more maintainable)
#    - Use stable class names or IDs (avoid auto-generated ones)
#    - Test against multiple pages from same source
#
# 2. Parser Implementation:
#    - Create named parser in this file if selectors insufficient
#    - Document parser logic in implementation notes
#    - Include example inputs/outputs for testing
#
# 3. Post-Processing:
#    - Set currency based on source default
#    - Set confidence level based on data quality
#    - Add notes about any special handling
#
# 4. Maintenance:
#    - Re-test adapters when source site layout changes
#    - Log parse failures with URL and error details
#    - Update selectors when site redesigns occur